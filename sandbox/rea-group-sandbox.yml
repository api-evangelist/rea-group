type: hosted-mock
detail: >-
  PropTrack publishes a Stoplight Prism mock server alongside every documented
  API service, advertised as "Mock Server" in the API Base URL panel on each
  service's docs page. The mocks are live, require NO authentication and no
  partner agreement, and serve the response examples defined in the published
  OpenAPI - including the documented error envelopes with real error codes. For a
  partner-gated API this is the only way to exercise the contract before a
  commercial agreement is signed, and it makes the response shapes testable by
  anyone.
authentication_required: false
separation:
  model: separate-host
  live: https://data.proptrack.com
  mock: https://stoplight.io/mocks/proptrack/apis/{serviceId}
  detail: >-
    Mock and live are entirely different hosts with different credentials
    requirements; there is no test/live key-prefix scheme. Each documented service
    has its own mock id and a mock only resolves routes belonging to that service.
