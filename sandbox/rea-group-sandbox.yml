usage_notes:
- >-
  Prism honours the standard Stoplight mock controls - send Prefer: example=<name>
  or Prefer: code=<status> to select a specific documented example or status code.
- >-
  A route belonging to another service returns a Prism UNPROCESSABLE_ENTITY
  "Route not resolved" body rather than a PropTrack error envelope; use the mock
  id that matches the service.
- >-
  Mock responses are the spec's examples, not live property data. They exercise
  shape and error semantics only.
