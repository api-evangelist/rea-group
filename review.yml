actions:
  openapiHarvested: true
  method: searched
  reason: |
    Nine provider-authored OpenAPI 3.1.0 documents were exported verbatim from
    PropTrack's own public Stoplight workspace. Nothing was fabricated. Our
    additions - the security scheme, contact block and cross-artifact extensions
    - live in overlays/rea-group-security-overlay.yaml and never mutate the
    harvested documents.
  pointersNotEmitted:
  - type: MCPServer
    reason: PropTrack publishes no MCP server; mcp/ is a derived candidate only.
  - type: Idempotency
    reason: No idempotency key, header or safe-retry contract exists.
  - type: Compliance
    reason: No trust centre, SOC 2 or ISO 27001 attestation published.
  - type: StatusPage
    reason: Verified absent.
  - type: Deprecation
    reason: No deprecation policy published.
  - type: SDKs
    reason: No first-party client libraries on npm or PyPI.
  - type: OAuthScopes
    reason: Client-credentials OAuth with no published scope surface.
