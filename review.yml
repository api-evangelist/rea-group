aid: rea-group
name: REA Group
review:
  question: Does REA Group expose a public, self-serve API, or is its developer surface partner-gated?
  answer: partner-gated, but fully specified and publicly mockable
  date: '2026-07-27'
  supersedes: '2026-07-20'
  reviewer: API Evangelist
  openapiHarvested: true
  openapiCount: 9
  operationCount: 32
corrections:
- date: '2026-07-27'
  field: review.openapiHarvested
  was: false
  now: true
  detail: |
    The 2026-07-20 review concluded that "no OpenAPI/Swagger document is publicly
    downloadable" and that "the Stoplight project export is gated". Both were
    wrong. The earlier pass tried the numeric id 18203562583 scraped from the
    rendered page - that is an Optimizely account id, not the Stoplight project -
    and gave up when the export API rejected it.

    The real Stoplight project id is base64 (cHJqOjE5MTUyMA = "prj:191520"), in a
    workspace whose own settings declare allowPublicProjects: true. It was
    recoverable by capturing the docs SPA's own XHR calls with a headless browser
    net-log. From there the public, unauthenticated table-of-contents and node
    export endpoints returned nine complete OpenAPI 3.1.0 documents totalling
    2.5MB, covering 32 operations with 189 named response examples.

    Lesson, and the same one Harmonic.ai taught: an identifier scraped from
    rendered HTML is not necessarily the identifier the application uses. When a
    docs site is a client-rendered SPA, capture what it actually fetches before
    concluding a spec does not exist.
findings:
  summary: |
    REA Group Limited (ASX:REA) does not offer a self-serve API, but it does
    publish a genuinely well-specified one. The PropTrack developer portal at
    developer.proptrack.com.au is a public Stoplight workspace carrying nine
    OpenAPI 3.1.0 service documents - OAuth, Address, Properties, Listings,
    Transactions, Market, Reports, Disclaimers and a Coming Soon service - and
    thirteen documentation articles covering authentication, error handling,
    pagination, rate limiting, trials, the rules engine and terms of use.

    The contract quality is above the catalogue norm: all 32 operations carry
    operationIds and summaries, 31 of 32 are tagged, every operation documents
    its 4xx/5xx responses, and 31 of 32 ship named response examples - 189 in
    total. Every service also exposes a live Stoplight Prism mock server that
    needs no authentication and serves the documented examples including the real
    error envelopes, which for a partner-gated API is a genuinely unusual and
    valuable thing to publish.

    The gating is real: data.proptrack.com returns 403 without credentials, and
    credentials are issued by an Account Manager under a commercial agreement.
    But the contract, the error registry, the rate limits, the pagination model
    and the trial terms are all public, so an integrator can build and test
    against the mocks before signing anything.

    There is no separate public developer portal for realestate.com.au,
    realcommercial.com.au, or REA India. The realestate.com.au partner surface is
    REAXML - REA Group's own XML listing-feed DTD, which is the de facto
    Australian listing-distribution standard and the structural substitute for
    the RESO Web API that does not exist in this market.
  strengths:
  - Nine OpenAPI 3.1.0 documents, provider-authored, publicly exportable
  - 189 named response examples across 31 of 32 operations
  - Complete 4xx/5xx response coverage on every operation
  - A published, numbered error-code registry (18 codes) with per-endpoint applicability
  - Per-endpoint rate limits published as concrete numbers, not vague guidance
  - A documented cursor pagination contract with defaults and maxima
  - Nine live unauthenticated mock servers - the contract is testable pre-sales
  - A documented trial programme with honest disclosure of its data restrictions
  - X-Transaction-Id request tracing wired into the support process
  gaps:
  - id: no-security-schemes
    severity: high
    detail: >-
      Not one of the nine documents declares components.securitySchemes, even
      though every data operation requires an OAuth 2.0 client-credentials bearer
      token that the portal documents in prose. Generated clients read the specs
      as unauthenticated. Captured in overlays/rea-group-security-overlay.yaml.
  - id: invalid-path-templates
    severity: high
    detail: >-
      Six path keys in the Properties document are not valid OpenAPI path
      templates - they embed query strings and prose, e.g.
      "/api/v1/properties/{propertyId}/valuations/sale?requestType=enquiry or
      requestType=origination" and "/api/v1/properties/valuations/sale ~ Pro".
      requestType should be an enum query parameter on a single path. Strict
      parsers reject these and codegen produces broken clients.
  - id: no-idempotency
    severity: high
    detail: >-
      The three POST operations are billable, side-effecting valuation and report
      orders, and they document 504 Gateway Timeout. With no idempotency key and
      no de-duplication contract, a client that retries a timeout cannot know
      whether it just paid for a second valuation. This is the sharpest edge in
      the surface.
  - id: no-components-reuse
    severity: medium
    detail: >-
      components.schemas is empty in all nine documents; every schema is inlined
      per operation, inflating the Properties document to 591KB and redefining
      the same logical entities repeatedly with no guarantee of consistency.
  - id: duplicate-operation-ids
    severity: medium
    detail: >-
      operationId "listings" is used in both the Listings and Properties
      documents, and "transactions" collides similarly. Each file is individually
      valid, but merging the nine services into one client - which is how the
      surface is actually consumed - produces collisions.
  - id: empty-info-version
    severity: medium
    detail: >-
      info.version is an empty string in all nine documents. Consumers cannot pin
      or diff a version; the only version signal is the v1/v2 URI path.
  - id: no-rate-limit-headers
    severity: medium
    detail: >-
      Per-endpoint limits are published as prose but no RateLimit or X-RateLimit
      response headers are emitted, so a client cannot observe remaining budget -
      it discovers exhaustion only via a 429. Rate-limit and quota exhaustion
      share HTTP 429 and error code 9011, distinguishable only by description text.
  - id: no-status-page
    severity: medium
    detail: >-
      Verified absent, not merely unfound. status.proptrack.com and
      status.proptrack.com.au do not resolve; proptrack.statuspage.io returns
      Atlassian's generic marketing page, not a PropTrack tenant.
  - id: no-deprecation-policy
    severity: medium
    detail: >-
      v1 and v2 are served concurrently with no published deprecation policy, no
      Sunset/Deprecation header support and no migration guidance.
  - id: no-changelog
    severity: low
    detail: No dated changelog or release notes. The Coming Soon page is the only forward signal.
  - id: no-sdks
    severity: low
    detail: >-
      No first-party client libraries. Checked npm and PyPI - nothing published
      under proptrack or rea-group.
  - id: no-mcp-server
    severity: low
    detail: >-
      No MCP server, no llms.txt on the docs host, no agent-facing surface of any
      kind. mcp/rea-group-mcp.yml is our derived candidate, not a provider claim.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://data.proptrack.com
    documented: true
    specified: true
    note: >-
      Nine OpenAPI 3.1.0 documents harvested. v2 for property data, v1 for
      valuations, reports and disclaimers. Returns 403 without partner credentials.
  - protocol: OAuth
    scheme: https
    baseURL: https://data.proptrack.com/oauth2/token
    documented: true
    specified: true
    note: >-
      OAuth 2.0 client credentials, client_secret_basic, returning a JWT bearer
      token with a 3600 second TTL. Specified in its own OpenAPI document.
  - protocol: XML feed
    scheme: https
    baseURL: https://reaxml.realestate.com.au
    documented: true
    specified: true
    note: >-
      REAXML propertyList DTD - REA Group's listing-distribution schema, uploaded
      through the realestate.com.au Partner Portal. Separate surface from the
      PropTrack REST APIs.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No streaming, webhook, event or AsyncAPI surface of any kind is documented.
  accessModel: partner-gated
  selfServeSignup: false
  publicDocs: true
  publicMocks: true
  apiProductsDocumented:
  - PropTrack OAuth 2.0 Token API (1 operation)
  - PropTrack Address API (2 operations - match, suggest)
  - PropTrack Properties API (15 operations - summary, attributes, listings, planning, tenure, transactions, search, and the full AVM surface)
  - PropTrack Listings API (3 operations - by id, point and radius, suburb and postcode)
  - PropTrack Transactions API (2 operations - point and radius, suburb and postcode)
  - PropTrack Market API (5 operations - sale history, rent history, supply and demand, auctions, demographics)
  - PropTrack Reports API (2 operations - AVM PDF, property report)
  - PropTrack Disclaimers API (1 operation)
  - PropTrack Upcoming APIs (1 operation - nearby education facilities, not yet released)
  - realestate.com.au REAXML listing feed (XML DTD, Partner Portal)
