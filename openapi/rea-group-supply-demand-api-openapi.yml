            Refer to [Status Codes & Error Handling](https://developer.proptrack.com.au/docs/apis/error-handling#marketsupply--demand) for information on error handling.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                          - 7004
                          - 7005
                          - 7007
                          - 7008
                          - 7009
                          - 7010
