openapi: 3.2.0
info:
  version: v2
  title: Market Supply & Demand API
  description: '- **Market/Auctions: GET /api/v2/market/auctions**

    Retrieves auction result statistics for a given state, suburb or greater capital city statistical area

    - **Market/Rent History: GET /api/v2/market/rent/historic/{metric}**

    Retrieves historic rental transaction statistics for a given suburb

    - **Market/Sale History: GET /api/v2/market/sale/historic/{metric}**

    Retrieves historic sale transaction statistics for a given suburb


    - **Market/Supply & Demand: GET…'
  termsOfService: https://developer.proptrack.com.au/docs/apis/terms-of-use
  contact:
    name: PropTrack
    url: https://www.proptrack.com.au/contact-us
    email: https://www.proptrack.com.au/contact-us
servers:
- url: https://data.proptrack.com
tags:
- name: Supply & Demand
paths:
  /api/v2/market/supply-and-demand/{metric}:
    get:
      tags:
      - Supply & Demand
      summary: /api/v2/market/supply-and-demand/{metric}
      description: Retrieves property supply and consumer demand statistics for a given suburb.
      operationId: market.supply-and-demand
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
      - name: state
        in: query
        description: State or territory within Australia
        required: true
        schema:
          enum:
          - act
          - nsw
          - nt
          - qld
          - sa
          - tas
          - vic
          - wa
          examples:
          - nsw
          type: string
      - name: postcode
        in: query
        description: Four digit postcode
        required: true
        schema:
          type: integer
          examples:
          - 2000
      - name: suburb
        in: query
        description: Suburb name
        required: true
        schema:
          type: string
          examples:
          - Sydney
      - name: startDate
        in: query
        description: Start of date range to be queried. Defaulted to 12 months prior to today's date if left empty</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-08-01'
      - name: endDate
        in: query
        description: End of date range to be queried. Defaulted to today's date if left empty</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-09-30'
      - name: propertyTypes
        in: query
        description: 'The type of properties that will be queried against</br>Note: Values are comma separated'
        required: true
        schema:
          enum:
          - house
          - unit
          examples:
          - house,unit
          type: array
      - name: frequency
        in: query
        description: Reporting frequency
        schema:
          enum:
          - monthly
          - weekly
          default: monthly
          examples:
          - monthly
          type: string
      - name: metric
        in: path
        description: Property market metric. </b> Refer to [Market Metrics](https://developer.proptrack.com.au/docs/apis/guide#market-metrics) for more information.
        required: true
        schema:
          enum:
          - potential-buyers
          - potential-renters
          examples:
          - potential-buyers
