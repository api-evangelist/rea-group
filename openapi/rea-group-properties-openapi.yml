  /api/v1/properties/valuations/sale ~ requestType=plus:
    post:
      tags:
      - AVM
      summary: /api/v1/properties/valuations/sale ~ Plus
      description: "<span style=\"color:#0078BD;\">**AVM Plus - by address:**</span> delivers a comprehensive\
        \ property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates\
        \ both sales and rental insights into a single, streamlined API endpoint.\n\nBy supplying a <span\
        \ style=\"color:#0078BD;\">**fullAddress or address**</span> , you can retrieve the latest and\
        \ most accurate valuation available, enabling faster decisions and seamless integration into your\
        \ business workflows.\n\n\n\n- <p style=\"color:#0078BD\"><b>Plus</B></p> <span style=\"background-color:\
        \ #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=plus</span></span> </p> offers a detailed\
        \ view of what goes into the price estimate for sale and rental including attributes, rental yield,\
        \ leased values and supporting valuation data, with the option to obtain a AVM Plus PDF report\n\
        \n<span style=\"color:#0078BD\"><b>Note:</B></span> <span style=\"background-color: #f5f5f5; padding:\
        \ 0.2em; font-weight: bold;\">requestType=plus</span></span> to be included in the body of the\
        \ request!\n\n ![AVM Plus](../assets/images/AVM-Plus.png)\n"
      operationId: v1-properties-valuation-sale-plus
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer eyJraWQiOiJiYWRmNzUyNC1jYzBkLTQ3YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiOiJKV1QiLCJhbGc
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
