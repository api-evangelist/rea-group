      operationId: avm-propertyId-enquiry
      x-stoplight:
        id: aggs2cg1cnt2m
      description: "<span style=\"color:#0078BD;\">**AVM Rental - by propertyId:**</span>Get a Rental\
        \ estimate from Proptrack’s Rental Automated Valuation Model (AVM).\n\nJust provide the  <span\
        \ style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">propertyId</span>\
        \ to get the most up-to-date rental estimate.\n\nWe offer two distinct <span style=\"background-color:\
        \ #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">requestType</span>, for the <span style=\"\
        background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">rent</span> estimates, each\
        \ type is operated by unique query parameters:\n\n\n- <p style=\"color:#0078BD\"><b>Enquiry:</B></p>\
        \ <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=enquiry</span></span>\
        \ </p> a simplified version only returning the property valuation details... \n ![Rental_Enquiry](../assets/images/enquiry-rent.png)\n\
        - <p style=\"color:#0078BD\"><b>Origination:</B></p> <span style=\"background-color: #f5f5f5;\
        \ padding: 0.2em; font-weight: bold;\">requestType=origination</span></span> </p> offers a detailed\
        \ view of what goes into the price estimate including attributes, yield, leased values and supporting\
        \ valuation data, with the option to obtain a Rental PDF report\n\n![Rental_Origination](../assets/images/AVM-Rental-Origination.png)\
        \ \n\n\n\n "
      parameters:
      - schema:
          type: string
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
        in: header
        name: Authorization
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
      - schema:
          type: string
          enum:
          - enquiry
          - origination
          example: enquiry
        in: query
        name: requestType
        description: 'the rental AVM request type. Note: origination coming soon'
        required: true
