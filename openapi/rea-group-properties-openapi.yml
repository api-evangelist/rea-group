  /api/v2/properties/{propertyId}/listings:
    get:
      tags:
      - Listings
      summary: /api/v2/properties/{propertyId}/listings
      description: Retrieves current and historic listings for a given property.
      operationId: listings
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer eyJraWQiOiJiYWRmNzUyNC1jYzBkLTQ3YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiOiJKV1QiLCJhbGc
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      - name: latestListingOnly
        in: query
        description: 'Return the single most recent listing '
        allowEmptyValue: true
        schema:
          type: boolean
          default: false
          examples:
          - true
      - name: numberOfResults
        in: query
        description: Limit the number of listings returned
        allowEmptyValue: true
        schema:
          type: integer
          maximum: 25
          default: 25
          examples:
          - 5
      - name: listingType
        in: query
        description: Select the type of listings returned
        allowEmptyValue: true
        schema:
          enum:
          - sale
          - rent
          examples:
          - sale
          type: string
      - name: status
        in: query
        description: Choose the status of the listings returned</br>Refer to [Listing Statuses](https://developer.proptrack.com.au/docs/apis/guide#listing-status)
