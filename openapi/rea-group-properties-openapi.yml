  /api/v1/properties/{propertyId}/valuations/sale?requestType=plus:
    get:
      tags:
      - AVM
      summary: /api/v1/properties/{propertyId}/valuations/sale?requestType=plus
      description: " <span style=\"color:#0078BD;\">**AVM Plus - by propertyId:**</span>  delivers a comprehensive\
        \ property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates\
        \ both sales and rental insights into a single, streamlined API endpoint.\n\nBy supplying a <span\
        \ style=\"color:#0078BD;\">**propertyId**</span> , you can retrieve the latest and most accurate\
        \ valuation available, enabling faster decisions and seamless integration into your business workflows.\n\
        \n\n- <p style=\"color:#0078BD\"><b>Plus</B></p> <span style=\"background-color: #f5f5f5; padding:\
        \ 0.2em; font-weight: bold;\">requestType=plus</span></span> </p> offers a detailed view of what\
        \ goes into the price estimate for sale and rental including attributes, rental yield, leased\
