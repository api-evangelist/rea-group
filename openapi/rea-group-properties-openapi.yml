servers:
- url: https://data.proptrack.com
  description: ''
paths:
  /api/v2/properties/{propertyId}/summary:
    parameters:
    - schema:
        type: integer
        example: 123456789
      name: propertyId
      in: path
      required: true
      description: Unique identifier for a property</br> Refer to [Obtaining a propertyId](https://developer.proptrack.com.au/docs/apis/guide#obtaining-a-propertyid)
    get:
      summary: /api/v2/properties/{propertyId}/summary
      tags:
      - Summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  propertyId:
                    type: integer
                    x-stoplight:
                      id: q7xkn5piafan2
                    example: 8282053
                    description: Unique identifier for a property
                  address:
                    type:
                    - object
                    - 'null'
                    description: Property Address
                    properties:
                      fullAddress:
                        type: string
                        x-stoplight:
                          id: 5zcjnr5bylbwx
                        example: 12 Bowman Cl, Araluen, NT 0870
                        description: Full address of the property
                      unitNumber:
                        type:
                        - string
                        - 'null'
                        x-stoplight:
                          id: 9con9e51ism0o
                        description: Unit number of the property
                      streetNumber:
                        type: string
                        x-stoplight:
                          id: clbko5io646v2
                        example: '12'
                        description: Street number of the property
                      streetName:
                        type: string
                        x-stoplight:
                          id: bw4tvscj30lip
                        example: BOWMAN
                        description: Street name of the property
                      streetType:
                        type: string
                        x-stoplight:
                          id: 5hlu0340u8gpp
                        example: CL
                        description: Street type of the property
                      suburb:
                        type: string
                        x-stoplight:
                          id: y963qnnh405jj
                        example: ARALUEN
                        description: Suburb of the property
                      postcode:
                        type: string
                        x-stoplight:
                          id: uq3cgq7x70fo4
                        example: 0870
                        description: Postcode of the property
                      state:
                        type: string
                        x-stoplight:
                          id: flar8wdlxumz6
                        example: NT
                        description: State of the proeprty
                      location:
                        type: object
                        x-stoplight:
                          id: 132d2f6rincwh
                        description: Geographical location of the property
                        properties:
                          latitude:
                            type:
                            - number
                            - 'null'
                            x-stoplight:
                              id: f8wfuuk7n91yk
                            example: -34.05438
                            format: float
                            description: Latitude of the property
                          longitude:
                            type:
                            - number
                            - 'null'
                            x-stoplight:
                              id: zaalil8hrli8m
                            example: 151.6941
                            format: float
                            description: Longitude of the property
                  attributes:
                    x-stoplight:
                      id: vjprtbbmqi2np
                    type:
                    - object
                    - 'null'
                    description: Basic property attributes
                    properties:
                      bedrooms:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: a9zi5xc7xzkq4
                        properties:
                          value:
                            type: integer
                            x-stoplight:
                              id: 7j4k9ktnp6k1p
                            example: 3
                            description: Number of bedrooms
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: muwf0padjmu3h
                            example: '2022-12-10'
                            description: Date that the source provided the data for this record.
                            format: date
                      bathrooms:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: xevadvjoh94ay
                        properties:
                          value:
                            type: integer
                            x-stoplight:
                              id: swxxo7b3t5mb5
                            example: 2
                            description: Number of bathrooms
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: 1ugflicke9iyp
                            example: '2022-12-10'
                            format: date
                            description: Date that the source provided the data for this record.
                      carSpaces:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: xsjmdm722qhd5
                        properties:
                          value:
                            type: integer
                            x-stoplight:
                              id: 3li5c1kkva2wp
                            example: 1
                            description: Number of car spaces
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: wembyvpemf5o7
                            example: '2022-12-10'
                            format: date
                            description: Date that the source provided the data for this record.
                      livingArea:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: 15pp9fi95kye2
                        properties:
                          value:
                            type: integer
                            x-stoplight:
                              id: ocuiz9j6z7027
                            example: 212
                            description: Living area (measured in m2)
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: q3y3d06efheqo
                            example: '2022-12-10'
                            format: date
                            description: Date that the source provided the data for this record.
                      landArea:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: gthtn8avs8wa3
                        properties:
                          value:
                            type: integer
                            x-stoplight:
                              id: m30y4qhfnj76b
                            example: 851
                            description: Land space area (measured in m2)
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: xqqywt8o9wvwv
                            example: '2022-12-10'
                            format: date
                            description: Date that the source provided the data for this record.
                      propertyType:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: z0t66hhmpp8wz
                        properties:
                          value:
                            x-stoplight:
                              id: grgym9ry9c8r6
                            example: house
                            enum:
                            - house
                            - unit
                            description: Classification of the type of property
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: z8gu3rlabpvwj
                            example: '2022-12-10'
                            format: date
                            description: Date that the source provided the data for this record.
                  recentSale:
                    x-stoplight:
                      id: bzgjd39mjrswl
                    type:
                    - object
                    - 'null'
                    description: Provides recent (within the past 6 months) sale information for a given
                      `propertyId`<br>If no sale has occurred in the past 6 months, this will return null
                    required:
                    - transactionDate
                    properties:
                      transactionDate:
                        type: string
                        x-stoplight:
                          id: nx1tp23jizhhl
                        example: '2023-01-25'
                        description: "Date associated with the transaction event<br>\r\nFormat `YYYY-MM-DD`"
                        format: date
                      sourceCategory:
                        x-stoplight:
                          id: h9kp1j8pjeow5
                        enum:
                        - vg
                        - agency
                        - other
                        example: agency
                        description: Source of transaction event data
                      saleValue:
                        type:
                        - integer
                        - 'null'
                        x-stoplight:
                          id: u84r5p1m5l7ce
                        example: 1350000
                        description: "Price associated with the transaction event <br>\r\nNote: suppressed\
                          \ transaction prices will be returned as undefined"
                      saleValueSuppressed:
                        type: boolean
                        x-stoplight:
                          id: lbyc1qn1xqquq
                        description: Flags if the saleValue has been suppressed
                      listingId:
                        type:
                        - string
                        - 'null'
                        x-stoplight:
                          id: b7ph3gbozq8ui
                        description: Unique identifier for a listing
                        example: '7654321'
                  image:
                    x-stoplight:
                      id: r13ft7o6ua5w1
                    type:
                    - object
                    - 'null'
                    description: Provides a single property image for use in property summary experiences.<br>Refer
                      to [Constructing an Image URL](https://developer.proptrack.com.au/docs/apis/faqs#how-do-i-construct-an-image-url)
                      for details on how to use this image object.
                    properties:
                      id:
                        type:
                        - string
                        - 'null'
                        x-stoplight:
                          id: m42v0vlg3d598
                        example: d300f1a395373a8622bb0fa1b2ec53d42951d5d363defc75d18a479b06d800c4.jpg
                        description: The identifier associated with the image
                      extension:
                        x-stoplight:
                          id: nh7hr644wuhdy
                        enum:
                        - jpg
                        - gif
                        - png
                        - pcx
                        - svg
                        - webp
                        - ppm
                        - tiff
                        - nb
                        example: jpg
                        description: File extension type
                      type:
                        x-stoplight:
                          id: fzuov6qm2la6r
                        enum:
                        - image
                        - floorplan
                        example: image
                        description: Image type
                      sha:
                        type:
                        - string
                        - 'null'
                        x-stoplight:
                          id: ijzdeupkgpgb6
                        example: d300f1a395373a8622bb0fa1b2ec53d42951d5d363defc75d18a479b06d800c4
                        description: Secure hashing algorithm
                  activeListings:
                    type: array
                    x-stoplight:
                      id: iy5usz8oixn50
                    description: "Provides an array of active rent or sale listings<br>\r\nIf the property\
                      \ has no active listings an empty array is returned"
                    items:
                      x-stoplight:
                        id: g4y5gi13rs9ug
                      type: object
                      properties:
                        listingId:
                          type: string
                          x-stoplight:
                            id: z06m8u4iy713w
                          description: Unique identifier for a listing
                          example: '7654321'
                        priceDescription:
                          type: string
                          x-stoplight:
