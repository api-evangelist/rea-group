  /api/v1/properties/valuations/sale:
    post:
      tags:
      - AVM
      summary: /api/v1/properties/valuations/sale ~ Enquiry or Origination
      description: "<span style=\"color:#0078BD;\">**AVM Sale - by address:**</span> Get a property price\
        \ estimate from PropTrack’s Sale Automated Valuation Model (AVM) using the property address. \n\
        \nThe service returns the most up-to-date value estimate, just provide the <span style=\"color:#0078BD;\"\
        >fullAddress OR address</span>, only provide either not both in the same request.\n\nThis operation\
        \ supports two <span style=\"color:#0078BD;\">requestType</span> options within the request body\
        \ based estimates. Each type uses its own request body parameters, and customers can be enabled\
        \ for one or both:\n\n- <p style=\"color:#0078BD\"><b>Enquiry:</B></p> <span style=\"background-color:\
        \ #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=enquiry</span></span> </p> a simplified\
        \ version only returning the property valuation details \n ![Sale_Enquiry](../assets/images/AVM-origination.png)\n\
        - <p style=\"color:#0078BD\"><b>Origination:</B></p> <span style=\"background-color: #f5f5f5;\
        \ padding: 0.2em; font-weight: bold;\">requestType=origination</span></span> </p> offers a detailed\
        \ view of what goes into the price estimate including attributes, and supporting valuation data,\
        \ with the option to obtain a Sale PDF report\n\n ![Sale_Origination](../assets/images/AVM-SALE-Origination.png)\n\
        \n"
      operationId: v1-properties-valuation-sale
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer eyJraWQiOiJiYWRmNzUyNC1jYzBkLTQ3YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiOiJKV1QiLCJhbGc
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      requestBody:
        description: 'Either `fullAddress` **or** `address` are required in the request, not both.


          We offer two distinct <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType</span>,
          for the <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">sale</span>
          estimates, each type is operated by unique <span style="background-color: #f5f5f5; padding:
          0.2em; font-weight: lite-bold;">requestType</span> in the body:


          - <p style="color:#0078BD"><b>Enquiry:</B></p> <span style="background-color: #f5f5f5; padding:
          0.2em; font-weight: bold;">requestType=enquiry</span></span> </p>will service your basic AVM
          needs by providing all fields you will find our PropTrackpowered experiences


          - <p style="color:#0078BD"><b>Origination:</B></p> <span style="background-color: #f5f5f5; padding:
          0.2em; font-weight: bold;">requestType=origination</span></span> </p> offers a more detailed
          view of what goes into the price estimate including attributes, comparable properties and other
          details

          '
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  fullAddress: 10 Test Street, Sydney NSW 2000
                  address:
                    lotNumber: Lot21
                    unitNumber: 2b
                    streetNumber: '10'
                    streetName: Test
                    streetType: St
                    suburb: Sydney
                    state: NSW
                    postCode: '2000'
                  effectiveDate: '2022-06-30'
                  updatedAttributes:
                    bedrooms: 3
                    bathrooms: 2
                    carSpaces: 1
                    propertyType: house
                    landArea: 325
                    floorArea: 114
                  additionalInformation:
                    applicantEstimate: 1000000
                    loanAmount: 800000
                    customerReference: Abc123
              required:
              - requestType
              - fullAddress
              - address
              properties:
                requestType:
                  x-stoplight:
                    id: dpjvk9vsiuh3b
                  enum:
                  - enquiry
                  - origination
                  - plus
                  example: enquiry
                  description: "requestType is mandatory for all new customers from Sept 2025, existing\
                    \ customers can continue without sending, please contact PropTrack support to discuss\
