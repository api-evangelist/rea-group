  /api/v1/properties/{propertyId}/valuations/sale?requestType=enquiry or requestType=origination:
    get:
      tags:
      - AVM
      summary: /api/v1/properties/{propertyId}/valuations/sale?requestType=enquiry or requestType=origination
      description: "<span style=\"color:#0078BD;\">**AVM Sale - by propertyId:**</span>Get a property\
        \ price estimate from PropTrack’s Sale Automated Valuation Model (AVM) using a propertyId. \n\n\
        The service returns the most up-to-date value estimate for the specified <span style=\"color:#0078BD;\"\
        >propertyId</span>.\n\nThis operation supports two <span style=\"color:#0078BD;\">requestType</span>\
        \ options for <span style=\"color:#0078BD;\">propertyId</span> based estimates. Each type uses\
        \ its own parameters, and customers can be enabled for one or both:\n\n\n- <p style=\"color:#0078BD\"\
        ><b>Enquiry:</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\"\
        >requestType=enquiry</span></span> </p> a simplified version only returning the property valuation\
        \ details \n ![Sale_Enquiry](../assets/images/AVM-origination.png)\n- <p style=\"color:#0078BD\"\
        ><b>Origination:</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight:\
        \ bold;\">requestType=origination</span></span> </p> offers a detailed view of what goes into\
        \ the price estimate including attributes, and supporting valuation data, with the option to obtain\
        \ a Sale PDF report\n\n ![Sale_Origination](../assets/images/AVM-SALE-Origination.png)\n\n"
      operationId: avm-propertyId
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      - name: propertyId
        in: path
        description: Unique identifier for a property</br>Refer to [Obtaining a propertyId](https://developer.proptrack.com.au/docs/apis/guide#obtaining-a-propertyid)
        required: true
        schema:
          type: string
          examples:
          - '1234567'
      - schema:
          type: string
          enum:
          - enquiry
          - origination
          example: origination
        in: query
        name: requestType
        required: true
        description: 'the requestType is mandatory for all new customers from Sept 2025, existing customers
          can continue without sending, please contact PropTrack support to discuss options to upgrade.
          Note: for ''plus'' see the AVM Plus endpoint: https://developer.proptrack.com.au/docs/apis/properties/operations/get-a-api-v-1-property-valuation-sale-request-type-plus    -
          <p style="color:#0078BD"><b>Enquiry:</p> <span style="background-color: #f5f5f5; padding: 0.2em;
          font-weight: bold;">requestType=enquiry</span></span> </b>will service your basic AVM needs
          by providing all fields you will find our PropTrackpowered experiences  - <p style="color:#0078BD"><b>Origination:</p>
          <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">requestType=origination</span></span>
          </b>offers a more detailed view of what goes into the price estimate including attributes, comparable
          properties and other details'
      requestBody:
        content: {}
      responses:
        '200':
          description: "<!-- theme: success -->\n\n> #### Success (200)\n\n\nBased on the <span style=\"\
            background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=?</span></span>\
            \ provided, the response is dynamic according to the response payload, \n**Note:** see examples\
            \ for the response of enquiry/origination, the mock-up doesn't reflect the requestType.\n\n\
            An AVM Sale Report can be generated for <span style=\"background-color: #f5f5f5; padding:\
            \ 0.2em; font-weight: bold;\">requestType=origination</span></span>for using the returned\
            \ <span style=\"color:#0078BD;\">**valuationId**</span>. Simply pass the <span style=\"color:#0078BD;\"\
            >**valuationId**</span> value into the GET AVM Report endpoint to retrieve a professionally\
            \ formatted report. For implementation details, refer to the <a href=\"https://developer.proptrack.com.au/docs/apis/reports/operations/get-a-api-v-1-report-valuation-pdf\"\
            >GET AVM Report</a>.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  valuationId:
                    type: string
                    description: 'Unique identifier for an AVM valuation.</br>This can be used to <a href="https://developer.proptrack.com.au/docs/apis/reports/operations/get-a-api-v-1-report-valuation-sale-pdf">Generate
                      a Report</a><br>Field available in: <span style="background-color: #f5f5f5; padding:
                      0.2em; font-weight: bold;">Enquiry</span>, <span style="background-color: #f5f5f5;
                      padding: 0.2em; font-weight: bold;">Origination</span></span><br>'
                    examples:
                    - 9a8b3368-fc5c-4a3d-9d4b-19ceecc387b2
                  valuationDate:
                    type: string
                    description: 'Date of the AVM valuation </br> Field available in: <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>, <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span> <br>Format
                      `YYYY-MM-DD`. </br>'
                    format: date
                    examples:
                    - '2022-12-25'
                  effectiveDate:
                    type: string
                    description: 'Effective date of requested estimate</br>Refer to [Effective Date](https://developer.proptrack.com.au/docs/apis/guide#effective-date)
                      </br>Format `YYYY-MM-DD`. </br>Field available in: <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>, <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span><br>'
                    format: date
                    examples:
                    - '2022-12-25'
                  propertyId:
                    type: integer
                    description: 'Unique identifier for a property</br> Field available in: <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>, <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                    examples:
                    - 1234567
                  estimatedValue:
                    type: integer
                    description: 'The estimated value for the property</br> Field available in: <span
                      style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>,
                      <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span><br>'
                    examples:
                    - 785652
                  fsd:
                    type: number
                    format: float
                    examples:
                    - 0.39079999923706055
                    description: 'Forecast standard deviation of the AVM estimate. </br> Field available
                      in:  <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                  confidenceLevel:
                    x-stoplight:
                      id: 878cx4dblu0i0
                    enum:
                    - HIGH CONFIDENCE
                    - MEDIUM CONFIDENCE
                    - LOW CONFIDENCE
                    description: 'The confidence level, based on the FSD</br>Refer to [Confidence Level](https://developer.proptrack.com.au/docs/apis/guide#confidence-level)<br>Field
                      available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight:
                      bold;">Enquiry</span>, <span style="background-color: #f5f5f5; padding: 0.2em; font-weight:
                      bold;">Origination</span></span><br>'
                  upperRangeValue:
                    type: integer
                    examples:
                    - 875250
                    description: 'The upper range estimate of the AVM.</br> Field available in: <span
                      style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>,
                      <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                  lowerRangeValue:
                    type: integer
                    description: 'The lower range estimate of the AVM</br> Field available in: <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Enquiry</span>, <span style="background-color:
                      #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                    examples:
                    - 712352
                  usedAttributes:
                    type: object
                    description: 'The attributes used for the AVM valuation</br> Fields available in:  <span
                      style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                    properties:
                      bedrooms:
                        type: integer
                        description: 'Number of bedrooms</br> Field available in:  <span style="background-color:
                          #f5f5f5; padding: 0.2em; font-weight: bold;">Origination</span></span>'
                        examples:
                        - 4
                      bathrooms:
                        type: integer
                        description: 'Number of bathrooms</br> Field available in:  <span style="background-color:
