          The <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType=pro</span>,
          will generate the <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">AVM
          Pro</span> response containing both Sales, rental and environmental hazards data in the same
