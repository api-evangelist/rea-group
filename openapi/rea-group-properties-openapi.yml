  /api/v1/properties/{propertyId}/valuations/sale?requestType=pro:
    get:
      tags:
      - AVM
      summary: /api/v1/properties/{propertyId}/valuations/sale?requestType=pro
      description: " <span style=\"color:#0078BD;\">**AVM Pro - by propertyId:**</span>  delivers a comprehensive\
        \ property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates\
        \ both sales, rental and environmental hazards into a single, streamlined API endpoint.\n\nBy\
        \ supplying a <span style=\"color:#0078BD;\">**propertyId**</span> , you can retrieve the latest\
        \ and most accurate valuation available, enabling faster decisions and seamless integration into\
        \ your business workflows.\n\n\n- <p style=\"color:#0078BD\"><b>Pro</B></p> <span style=\"background-color:\
        \ #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=pro</span></span> </p> offers a detailed\
        \ view of what goes into the price estimate for sale, rental and environmental hazards including\
        \ attributes, rental yield, leased values and supporting valuation data, with the option to obtain\
        \ a AVM Pro PDF report\n\n ![AVM Pro](../assets/images/AVM_PRO.png)\n\n"
      operationId: avm-propertyId-pro
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
