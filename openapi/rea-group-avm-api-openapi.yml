  /api/v1/properties/valuations/sale ~ Pro:
    parameters: []
    post:
      tags:
      - AVM
      summary: /api/v1/properties/valuations/sale ~ Pro
      description: "<span style=\"color:#0078BD;\">**AVM Pro - by address:**</span> delivers a comprehensive property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates both sales, rental and environmental hazards insights into a single, streamlined API endpoint.\n\nBy supplying a <span style=\"color:#0078BD;\">**fullAddress or address**</span> , you can retrieve the latest and most accurate valuation available, enabling faster decisions and seamless integration into your business workflows.\n\n\n- <p style=\"color:#0078BD\"><b>Plus</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=pro</span></span> </p> offers a detailed view of what goes into the price estimate for sale, rental, rental and environmental hazards including attributes, rental yield, leased values and supporting valuation data, with the option to obtain a AVM Pro PDF report\n\n\n<span style=\"color:#0078BD\"><b>Note:</B></span> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=pro</span></span> to be included in the body of the request!\n\n\n ![AVM Pro](../assets/images/AVM_PRO.png)\n"
      operationId: v1-properties-valuation-sale-pro
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer eyJraWQiOiJiYWRmNzUyNC1jYzBkLTQ3YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiOiJKV1QiLCJhbGc
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      requestBody:
        description: 'Either `fullAddress` **or** `address` are required in the request, not both.


          The <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType=pro</span>, will generate the <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">AVM Pro</span> response containing both Sales, rental and environmental hazards data in the same endpoint<span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType</span> in the body:


          '
