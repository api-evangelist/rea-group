      operationId: avm-propertyId-enquiry
      x-stoplight:
        id: aggs2cg1cnt2m
      description: "<span style=\"color:#0078BD;\">**AVM Rental - by propertyId:**</span>Get a Rental estimate from Proptrack’s Rental Automated Valuation Model (AVM).\n\nJust provide the  <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">propertyId</span> to get the most up-to-date rental estimate.\n\nWe offer two distinct <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">requestType</span>, for the <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;\">rent</span> estimates, each type is operated by unique query parameters:\n\n\n- <p style=\"color:#0078BD\"><b>Enquiry:</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=enquiry</span></span> </p> a simplified version only returning the property valuation details... \n ![Rental_Enquiry](../assets/images/enquiry-rent.png)\n- <p style=\"color:#0078BD\"><b>Origination:</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=origination</span></span> </p> offers a detailed view of what goes into the price estimate including attributes, yield, leased values and supporting valuation data, with the option to obtain a Rental PDF report\n\n![Rental_Origination](../assets/images/AVM-Rental-Origination.png) \n\n\n\n "
      parameters:
      - schema:
          type: string
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
        in: header
        name: Authorization
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
      - schema:
          type: string
          enum:
          - enquiry
          - origination
          example: enquiry
        in: query
        name: requestType
        description: 'the rental AVM request type. Note: origination coming soon'
        required: true
  /api/v1/properties/valuations/sale ~ requestType=plus:
    parameters: []
    post:
      tags:
      - AVM
      summary: /api/v1/properties/valuations/sale ~ Plus
      description: "<span style=\"color:#0078BD;\">**AVM Plus - by address:**</span> delivers a comprehensive property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates both sales and rental insights into a single, streamlined API endpoint.\n\nBy supplying a <span style=\"color:#0078BD;\">**fullAddress or address**</span> , you can retrieve the latest and most accurate valuation available, enabling faster decisions and seamless integration into your business workflows.\n\n\n\n- <p style=\"color:#0078BD\"><b>Plus</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=plus</span></span> </p> offers a detailed view of what goes into the price estimate for sale and rental including attributes, rental yield, leased values and supporting valuation data, with the option to obtain a AVM Plus PDF report\n\n<span style=\"color:#0078BD\"><b>Note:</B></span> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=plus</span></span> to be included in the body of the request!\n\n ![AVM Plus](../assets/images/AVM-Plus.png)\n"
      operationId: v1-properties-valuation-sale-plus
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer eyJraWQiOiJiYWRmNzUyNC1jYzBkLTQ3YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiOiJKV1QiLCJhbGc
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      requestBody:
        description: 'Either `fullAddress` **or** `address` are required in the request, not both.


          The <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType=plus</span>, will generate the <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">AVM Plus</span> response containing both Sales and Rental data in the same endpoint<span style="background-color: #f5f5f5; padding: 0.2em; font-weight: lite-bold;">requestType</span> in the body:


          '
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  fullAddress: 10 Test Street, Sydney NSW 2000
                  address:
                    lotNumber: Lot21
                    unitNumber: 2b
                    streetNumber: '10'
                    streetName: Test
                    streetType: St
                    suburb: Sydney
                    state: NSW
                    postCode: '2000'
                  effectiveDate: '2022-06-30'
                  updatedAttributes:
                    bedrooms: 3
                    bathrooms: 2
                    carSpaces: 1
                    propertyType: house
                    landArea: 325
                    floorArea: 114
                  additionalInformation:
                    applicantEstimate: 1000000
                    loanAmount: 800000
                    customerReference: Abc123
              required:
              - requestType
              - fullAddress
              - address
              properties:
                requestType:
                  example: plus
                  description: the requestType is mandatory for AVM Plus
                  default: plus
                  enum:
                  - plus
                fullAddress:
                  type: string
                  description: 'Full address of the property, either fullAddress or address not both allowed<br>Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Plus</span><br>

                    '
                  examples:
                  - 1/67 Louisa Rd, Birchgrove, NSW 2041
                address:
                  type: object
