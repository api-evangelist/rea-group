  /api/v1/properties/{propertyId}/valuations/sale?requestType=plus:
    parameters:
    - schema:
        type: string
      name: propertyId
      in: path
      required: true
    get:
      tags:
      - AVM
      summary: /api/v1/properties/{propertyId}/valuations/sale?requestType=plus
      description: " <span style=\"color:#0078BD;\">**AVM Plus - by propertyId:**</span>  delivers a comprehensive property price estimate powered by PropTrack’s advanced Automated Valuation Model. It consolidates both sales and rental insights into a single, streamlined API endpoint.\n\nBy supplying a <span style=\"color:#0078BD;\">**propertyId**</span> , you can retrieve the latest and most accurate valuation available, enabling faster decisions and seamless integration into your business workflows.\n\n\n- <p style=\"color:#0078BD\"><b>Plus</B></p> <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=plus</span></span> </p> offers a detailed view of what goes into the price estimate for sale and rental including attributes, rental yield, leased values and supporting valuation data, with the option to obtain a AVM Plus PDF report\n\n ![AVM Plus](../assets/images/AVM-Plus.png)\n\n"
      operationId: avm-propertyId-plus
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
      - name: propertyId
        in: path
        description: Unique identifier for a property</br>Refer to [Obtaining a propertyId](https://developer.proptrack.com.au/docs/apis/guide#obtaining-a-propertyid)
        required: true
        schema:
          type: string
          examples:
          - '1234567'
      - schema:
          type: string
          example: plus
          enum:
          - plus
        in: query
        name: requestType
        description: '**Mandatory:** Specifies the valuation request type, the <span style="color:#0078BD;">**plus**</span> requestType is mandatory for all AVM Plus requests. </br> **Note:** If the requestType included is a ''enquiry'' or ''origination'' then these are treated as a AVM Sale request and not a AVM Plus request'
        required: true
      - schema:
          type: string
          example: '2026-02-28'
          format: date
        in: query
        name: effectiveDate
        description: '**Optional:** Effective date of the requested valuation estimate</br>Refer to [Effective Date](https://developer.proptrack.com.au/docs/apis/guide#effective-date)</br>Format `YYYY-MM-DD` <br>'
      - schema:
          type: string
          example: ABC123
        in: query
        name: customerReference
        description: '**Optional:** Client-defined reference key for tracking or reconciliation purposes. Maximum length: 50 characters</br>Refer to [Customer Reference](https://developer.proptrack.com.au/docs/apis/guide#customerreference)<br>'
      - schema:
          type: number
          example: 4
        in: query
        name: bedrooms
        description: '**Optional:** Number of bedrooms used to refine the valuation estimate.'
      - schema:
          type: number
          example: 2
        in: query
        name: bathrooms
        description: '**Optional:** Number of bathrooms used to refine the valuation estimate.'
      - schema:
          type: number
          example: 1
        in: query
        name: carSpaces
        description: '**Optional:** Number of car spaces used to refine the valuation estimate.'
      - schema:
          type: string
          example: house
          enum:
          - house
          - unit
        in: query
        name: propertyType
        allowEmptyValue: true
        description: '**Optional:** Classification of the type of property type<br>'
      requestBody:
        content: {}
      responses:
        '200':
          description: "<!-- theme: success -->\n\n> #### Success (200)\nResponse delivers comprehensive Sale and Rental data to support informed property insights based on the <span style=\"background-color: #f5f5f5; padding: 0.2em; font-weight: bold;\">requestType=plus</span></span> provided, the response is dynamic according to the response payload, \n**Note:** see examples for the AVM Plus response.\n\nAn AVM Plus Report can be generated using the returned <span style=\"color:#0078BD;\">**valuationId**</span>. Simply pass the <span style=\"color:#0078BD;\">**valuationId**</span> value into the GET AVM Report endpoint to retrieve a professionally formatted report. For implementation details, refer to the <a href=\"https://developer.proptrack.com.au/docs/apis/reports/operations/get-a-api-v-1-report-valuation-pdf\">GET AVM Report</a>.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  valuationId:
                    type: string
                    description: 'Unique identifier for an AVM valuation.</br>This can be used to <a href="https://developer.proptrack.com.au/docs/apis/reports/operations/get-a-api-v-1-report-valuation-sale-pdf">Generate a Report</a><br>Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Plus</span>'
                    examples:
                    - 9a8b3368-fc5c-4a3d-9d4b-19ceecc387b2
                  valuationDate:
                    type: string
                    description: 'Date of the AVM valuation </br> Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">plus</span>, Format `YYYY-MM-DD`. </br>'
                    format: date
                    examples:
                    - '2022-12-25'
                  effectiveDate:
                    type: string
                    description: 'Effective date of requested estimate</br>Refer to [Effective Date](https://developer.proptrack.com.au/docs/apis/guide#effective-date) </br>Format `YYYY-MM-DD`. </br>Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Plus</span><br>'
                    format: date
                    examples:
                    - '2022-12-25'
                  propertyId:
                    type: integer
                    description: 'Unique identifier for a property</br> Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Plus</span>'
                    examples:
                    - 1234567
                  matchQuality:
                    x-stoplight:
