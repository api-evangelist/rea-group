                        description: 'The <span style="color:#0078BD;">RENTAL</span> Yield confidence level, based on the FSD</br>Refer to [Confidence Level](https://developer.proptrack.com.au/docs/apis/guide#confidence-level)<br>Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Pro</span><br>'
                        example: MEDIUM CONFIDENCE
                        enum:
                        - HIGH CONFIDENCE
                        - MEDIUM CONFIDENCE
                        - LOW CONFIDENCE
                      lowerRangeValue:
                        type: number
                        description: 'The <span style="color:#0078BD;">RENTAL</span> Yield lower range estimate of the AVM.</br> Field available in: <span style="background-color: #f5f5f5; padding: 0.2em; font-weight: bold;">Pro</span>'
