  /api/v2/market/sale/historic/{metric}:
    get:
      tags:
      - Sale History
      summary: /api/v2/market/sale/historic/{metric}
      description: "Retrieves historic sale transaction statistics for a given suburb.\r\n\r\n#### Data\
        \ Attribution Notice:\r\nThis endpoint contains State and Territory data which may be subject\
        \ to  approval by the relevant government department.\r\nDue to licensing agreement requirements,\
        \ it is necessary to include data disclaimers and PropTrack branding when displaying this data\
        \ in a user experience or printable output.\r\n<br><br>\r\nDisclaimer Types: `vg`,`serviceAgent`\r\
        \n\r\nPlease refer to [Disclaimers and Branding](https://developer.proptrack.com.au/docs/apis/disclaimersBranding)\
        \ for more information on implementing data source disclaimers in your experience.\r\n"
      operationId: market.sale-history
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
      - name: propertyTypes
        in: query
        description: 'The type of properties that will be queried against</br>Note: Values are comma separated'
        required: true
        schema:
          enum:
          - house
          - unit
          examples:
          - house,unit
          type: array
      - name: frequency
        in: query
        description: Reporting frequency</br>Returns the monthly or yearly calculated metrics
        schema:
          enum:
          - yearly
          - monthly
          default: yearly
          examples:
          - yearly
          type: string
      - name: state
        in: query
        description: State or territory within Australia
        required: true
        schema:
          enum:
          - act
          - nsw
          - nt
          - qld
          - sa
          - tas
          - vic
          - wa
          examples:
          - nsw
          type: string
      - name: postcode
        in: query
        description: Four digit postcode
        required: true
        schema:
          type: integer
          examples:
          - 2000
      - name: suburb
        in: query
        description: Suburb name
        required: true
        schema:
          type: string
          examples:
          - Sydney
      - name: startDate
        in: query
        description: Start of date range to be queried. Defaulted to 12 months prior to today's date if
          left empty</br>Applicable for `sale-transaction-volume` and `median-sale-price` metrics only</br>Format
          `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-07-01'
      - name: endDate
        in: query
        description: End of date range to be queried. Defaulted to today's date if left empty</br>Applicable
          for `sale-transaction-volume` and `median-sale-price` metrics only</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-09-01'
      - name: metric
        in: path
        description: Property market metric. </b> Refer to [Market Metrics](https://developer.proptrack.com.au/docs/apis/guide#market-metrics)
          for more information.
        required: true
        schema:
          enum:
          - sale-transaction-volume
          - median-sale-price
          - median-days-on-market
          examples:
          - median-sale-price
