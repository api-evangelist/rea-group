paths:
  /api/v2/market/rent/historic/{metric}:
    get:
      tags:
      - Rent History
      summary: /api/v2/market/rent/historic/{metric}
      description: Retrieves historic rental transaction statistics for a given suburb.
      operationId: market.rent-history
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
          default: Bearer {access_token}
          example: Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
      - name: propertyTypes
        in: query
        description: 'The type of properties that will be queried against</br>Note: Values are comma separated'
        required: true
        schema:
          enum:
          - house
          - unit
          examples:
          - house,unit
          type: array
      - name: frequency
        in: query
        description: Reporting frequency</br>`monthly` frequency is applicable for `rental-transaction-volume`, `median-days-on-market` and `median-rental-price` metrics only
        schema:
          enum:
          - yearly
          - monthly
          default: yearly
          examples:
          - yearly
          type: string
      - name: state
        in: query
        description: State or territory within Australia
        required: true
        schema:
          enum:
          - act
          - nsw
          - nt
          - qld
          - sa
          - tas
          - vic
          - wa
          examples:
          - nsw
          type: string
      - name: postcode
        in: query
        description: Four digit postcode
        required: true
        schema:
          type: integer
          examples:
          - 2000
      - name: suburb
        in: query
        description: Suburb name
        required: true
        schema:
          type: string
          examples:
          - Sydney
      - name: startDate
        in: query
        description: Start of date range to be queried. Defaulted to 12 months prior to today's date if left empty</br>Applicable for `rental-transaction-volume` and `median-rental-price` metrics only</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-07-01'
      - name: endDate
        in: query
        description: End of date range to be queried. Defaulted to today's date if left empty</br>Applicable for `rental-transaction-volume` and `median-rental-price` metrics only</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-09-01'
      - name: metric
        in: path
        description: Property market metric. </b> Refer to [Market Metrics](https://developer.proptrack.com.au/docs/apis/guide#market-metrics) for more information.
        required: true
        schema:
          enum:
          - median-rental-yield
          - rental-transaction-volume
          - median-rental-price
          - median-days-on-market
          examples:
          - median-rental-yield
      responses:
        '200':
          description: '<!-- theme: success -->


            > #### Success (200)'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    propertyType:
                      enum:
                      - house
                      - unit
                      description: Type of property
                    dateRanges:
                      type: array
                      description: Time period which the metric is expressed across
                      items:
                        type: object
                        properties:
                          startDate:
                            type: string
                            description: First date in the date range</br>Format `YYYY-MM-DD`
                            format: date
                            examples:
                            - '2021-10-01'
                          endDate:
                            type: string
                            description: Last date in the date range</br>Format `YYYY-MM-DD`
                            format: date
                            examples:
                            - '2022-09-30'
                          metricValues:
                            type: array
                            items:
                              type: object
                              properties:
                                bedrooms:
                                  enum:
                                  - '0'
                                  - '1'
                                  - '2'
                                  - '3'
                                  - '4'
                                  - 4+
                                  - 5+
                                  - combined
                                  description: Number of bedrooms that the metric is expressed by
                                  examples:
                                  - '3'
                                value:
                                  type: number
                                  description: Data for the chosen corresponding metric
                                  format: float
                                  examples:
                                  - 1.305889
                x-examples:
                  Example 1:
                  - propertyType: house
                    dateRanges:
                    - startDate: '2021-09-01'
                      endDate: '2022-08-31'
                      metricValues:
                      - bedrooms: '1'
                        value: 10
                      - bedrooms: '2'
                        value: 11
                      - bedrooms: '3'
                        value: 18
                      - bedrooms: '4'
                        value: 24
                      - bedrooms: 5+
                        value: 14
                  - propertyType: unit
                    dateRanges:
                    - startDate: '2021-09-01'
                      endDate: '2022-08-31'
                      metricValues:
                      - bedrooms: '1'
                        value: 14
                      - bedrooms: '2'
                        value: 14
                      - bedrooms: '3'
                        value: 16
                      - bedrooms: 4+
                        value: 16
              examples:
                Median Days on Site (yearly):
