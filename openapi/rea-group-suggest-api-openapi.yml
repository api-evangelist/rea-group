openapi: 3.2.0
info:
  version: v2
  title: Address Suggest API
  description: '- **Address/Match: GET /api/v2/address/match**

    Matches to a corresponding record on PropTrack''s master address file based on a given address string


    - **Address/Suggest: GET /api/v2/address/suggest**

    Suggests a list of addresses based on a given address string


    Getting Started


    Start your journey


    API Trials


    Authentication


    Error Handling


    API References


    Explore our knowledge base


    API Guide


    Rate Limiting


