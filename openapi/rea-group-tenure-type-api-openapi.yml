servers:
- url: https://data.proptrack.com
  description: ''
tags:
- name: Tenure Type
  description: Property Tenure Type History
paths:
  /api/v2/properties/{propertyId}/tenureType:
    parameters:
    - schema:
        type: integer
      name: propertyId
      in: path
      required: true
      description: Unique identifier for a property<br>Refer to [Obtaining a propertyId](https://developer.proptrack.com.au/docs/apis/guide#obtaining-a-propertyid)
      example: 8282053
    get:
      summary: /api/v2/properties/{propertyId}/tenureType
      parameters:
      - schema:
          type: string
          example: Bearer xxxxx
        in: header
        name: Authorization
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  propertyId:
                    type: integer
                    x-stoplight:
                      id: m9gokv4hbaod4
                  tenureTypeHistory:
                    type: array
                    x-stoplight:
                      id: 3kjl0kfcd6ble
                    items:
                      x-stoplight:
                        id: hpfdg745f29ud
                      type: object
                      properties:
                        startDate:
                          type:
                          - string
                          - 'null'
                          x-stoplight:
                            id: 4y9lj709ivubu
                          example: '2015-01-01'
                          format: date
                        endDate:
                          type:
                          - string
                          - 'null'
                          x-stoplight:
                            id: u36wi1ueyd8rq
                          format: date
                          example: '2024-12-31'
                        tenureType:
                          x-stoplight:
                            id: r4vh3ehph7rtg
                          enum:
                          - ownerOccupied
                          - renterOccupied
                          example: ownerOccupied
              examples:
                Single tenure type:
                  value:
                    propertyId: 8282053
                    tenureTypeHistory:
                    - startDate: '2015-01-01'
                      endDate: null
                      tenureType: ownerOccupied
                Tenure History:
                  value:
                    propertyId: 0
                    tenureTypeHistory:
                    - startDate: '2015-01-01'
                      endDate: '2025-01-01'
                      tenureType: ownerOccupied
                    - startDate: '2025-01-01'
                      endDate: null
                      tenureType: renterOccupied
        '400':
          description: '<!-- theme: danger -->


            > #### Bad Request (400)'
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
              description: Media type of the resource
            X-Transaction-Id:
              schema:
                type: string
                example: bxxe12cb-a6a8-4cad-9a8c-4f1d8abfa0d9
              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: a7pv1wt41f4w0
                    items:
                      x-stoplight:
                        id: lqm2qv8uegzjf
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: lnnljss9nc93d
                          enum:
                          - 7004
                          - 7008
                          - 7011
                          description: Defines the type of error that has occurred
                        description:
                          type: string
                          x-stoplight:
                            id: xr0hrivyq13vy
                          description: Overview of the error that has occurred
                          example: An incorrect field type has been entered - Please ensure that all values are using the correct field type
                        parameters:
                          type: object
                          x-stoplight:
                            id: 6vrvs2iwa0k7v
                          description: A set of parameters that are causing the error and the rule that was invoked
                          properties:
                            propertyId:
                              type: string
                              x-stoplight:
                                id: om8f7maax6knd
                              example: must be an integer
                      required:
                      - code
                      - description
        '401':
          description: '<!-- theme: danger -->


            > #### Unauthorized (401)'
