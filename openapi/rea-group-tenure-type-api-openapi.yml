            Content-Type:
              schema:
                type: string
                enum:
                - application/json
              description: Media type of the resource
            X-Transaction-Id:
              schema:
                type: string
                example: bxxe12cb-a6a8-4cad-9a8c-4f1d8abfa0d9
              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: ysusgtiiltdnh
                    items:
                      x-stoplight:
                        id: ciltcajyuu6i4
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: uggewv2jz4jr2
                          enum:
                          - 9012
                          - 9016
                          description: Defines the type of error that has occurred
                        level:
                          x-stoplight:
                            id: 06a5rvfr5140h
                          x-deprecated: true
                          enum:
