              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: wd47zsexlbpuk
                    items:
                      x-stoplight:
                        id: c6kcexl4jltcg
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: o34fma7cxej4v
                          enum:
                          - 9003
                          description: Defines the type of error that has occurred
                        description:
                          type: string
                          x-stoplight:
                            id: nvcd9p746hri3
                          description: Overview of the error that has occurred
                          example: Access denied - Please contact our customer support team at support@proptrack.com for access to this endpoint
                      required:
                      - code
                      - description
        '404':
          description: '<!-- theme: danger -->


            > #### Not Found (404)'
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
              description: Media type of the resource
            X-Transaction-Id:
              schema:
                type: string
                example: bxxe12cb-a6a8-4cad-9a8c-4f1d8abfa0d9
              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: sdecbxpt90s6u
                    items:
                      x-stoplight:
                        id: qgqgmwvec4dux
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: k15mcw6taaq90
                          enum:
                          - 7002
                          description: Defines the type of error that has occurred
                        description:
                          type: string
                          x-stoplight:
                            id: 49bumtglgzczn
                          description: Overview of the error that has occurred
                        parameters:
                          type: object
                          x-stoplight:
                            id: lofxlczzupgr8
                          description: A set of parameters that are causing the error and the rule that was invoked
                          properties:
                            propertyId:
                              type: string
                              x-stoplight:
                                id: ztpw5af9yyrxp
                              example: cannot be found
                      required:
