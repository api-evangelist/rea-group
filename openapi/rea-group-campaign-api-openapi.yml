openapi: 3.2.0
info:
  title: display performance Campaign API
  description: Aggregated reporting data for developer campaign display performance.
  version: 0.0.3
servers:
- url: https://api.realestate.com.au
security:
- PartnerPlatform:
  - display:campaign-performance:read
tags:
- name: Campaign
paths:
  /campaign/v1/display-performance:
    get:
      tags:
      - Campaign
      summary: Get multiple campaigns
      description: Returns a paginated collection of campaigns
      parameters:
      - name: where[name][iLike]
        in: query
        description: Find all campaigns where name contains a given value
        schema:
          type: string
          example: Super-special-campaign
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      - $ref: '#/components/parameters/status'
      - name: product
        in: query
        schema:
          type: string
          example: Display
        description: Find all campaigns of a certain product type.
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageIndex'
      - name: sortBy[costPerLead]
        in: query
        description: 'Specify the sorting field (`asc` or `desc`). Any field can be sorted by changing the value in the square brackets. For example, `sortBy[createdAt]=asc`

          '
        schema:
          type: string
          example: asc
      - $ref: '#/components/parameters/listingId'
      - name: excludeCommercialCampaigns
        in: query
        description: 'Passing "true" will exclude all the Commercial Native Ads campaigns from response, any other value will return both Commercial and Residential campaigns.

          '
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - PartnerPlatform:
        - display:campaign-performance:read
      operationId: getCampaignV1DisplayPerformance
      x-operation-id-source: derived
  /campaign/v1/display-performance/{campaignId}:
    get:
      tags:
      - Campaign
      summary: Get single campaign
      description: Return a detailed campaign by campaign ID
      parameters:
      - $ref: '#/components/parameters/campaignId'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - PartnerPlatform:
        - display:campaign-performance:read
      operationId: getCampaignV1DisplayPerformanceByCampaignId
      x-operation-id-source: derived
  /campaign/v1/display-performance/csv:
    get:
      tags:
      - Campaign
      summary: Get single or multiple campaigns in CSV format
      description: Return single or multiple campaign `detail` or `snapshot` reports in a single CSV
      parameters:
      - name: campaignIds
        in: query
        description: Find campaign data where one or more campaign ids equal to a given value
        required: true
        schema:
          type: string
          example: 12345, 67890
      - name: filename
        in: query
        description: The filename of the downloaded csv. Default is `Campaigns Detail Report.csv`
        schema:
          type: string
          example: 12345.csv
      - name: snapshot
        in: query
        description: Determine whether CSV returned is of snapshot or detail view
        schema:
          type: boolean
          example: true
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      responses:
        '200':
          description: Successful Operation
          content:
            text/csv: {}
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - PartnerPlatform:
        - display:campaign-performance:read
      operationId: getCampaignV1DisplayPerformanceCsv
      x-operation-id-source: derived
components:
  responses:
    RateLimitedError:
      description: Too Many Requests. You have exceeded the maximum number of requests permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: 422 Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestError:
      description: Bad request. The request is missing required fields or is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: A general error has occurred. Inspect the payload for additional information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SelfLink:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
              example: https://exampleurl.com
    Advertiser:
      type: object
      properties:
        id:
          type: string
          example: '3333'
        name:
          type: string
          example: Agency Limited
    AccountManager:
      type: object
      properties:
        id:
          type: string
          example: '4444'
        name:
          type: string
          example: Owen Wilson
    Links:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
              example: https://exampleurl.com
        next:
          type: object
          properties:
            href:
              type:
              - string
              - 'null'
              example: https://exampleurl.com?page=2
    CampaignListResponse:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BasicCampaign'
        _links:
          $ref: '#/components/schemas/Links'
        total:
          type: integer
          example: 20
    CampaignResponse:
      type: object
      properties:
        id:
          type: string
          example: '11111'
        name:
          type: string
          example: Harmik Estates
        product:
          type: string
          example: Display
        status:
          type: string
          example: active
        impressionsGoal:
          type: string
          example: '8'
        budget:
          type: string
          example: '1000.00'
        accountManager:
          type: string
          example: Owen Wilson
        startDate:
          type: string
          example: '2021-09-16 13:00:00'
        endDate:
          type: string
          example: '2021-09-17 13:00:00'
        advertiser:
          type: string
          example: Agency Limited
        updatedAt:
          type: string
          example: '2021-09-17 10:00:00'
        impressionsDelivered:
          type: string
          example: '2'
        clicksDelivered:
          type: string
          example: '2'
        spend:
          type: string
          example: '0.00'
        leadsDelivered:
          type: string
          example: '2'
        costPerLead:
          type: string
          example: '20.00'
        clickThroughRate:
          type: string
          example: '50.00'
        clickThroughConversion:
          type: string
          example: '50.00'
        listingId:
          type: string
          example: '5123456'
        performance:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  campaignId:
                    type: string
                    example: '11111'
                  impressionsDelivered:
                    type: string
                    example: '1'
                  clicksDelivered:
                    type: string
                    example: '1'
                  leadsDelivered:
                    type: string
                    example: '1'
                  leadsDeliveredPostClicks:
                    type: string
                    example: '1'
                  leadsDeliveredPostImpressions:
                    type: string
                    example: '0'
                  spend:
                    type: string
                    example: '0.00'
                  day:
                    type: string
                    example: '1'
        _links:
          $ref: '#/components/schemas/SelfLink'
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    BasicCampaign:
      type: object
      properties:
        id:
          type: string
          example: '11111'
        name:
          type: string
          example: Harmik Estates
        product:
          type: string
          example: Display
        status:
          type: string
          example: active
        accountManager:
          $ref: '#/components/schemas/AccountManager'
        advertiser:
          $ref: '#/components/schemas/Advertiser'
        createdAt:
          type: string
          example: '2021-09-16 13:00:00'
        startDate:
          type: string
          example: '2021-09-17 13:00:00'
        endDate:
          type: string
          example: '2021-09-18 13:00:00'
        impressionsGoal:
          type: string
          example: '8'
        impressionsDelivered:
          type: string
          example: '2'
        clicksDelivered:
          type: string
          example: '2'
        leadsDelivered:
          type: string
          example: '2'
        clickThroughRate:
          type: string
          example: '50.00'
        costPerLead:
          type: string
          example: '20.00'
        budget:
          type: string
          example: '1000.00'
        spend:
          type: string
          example: '0.00'
        budgetRemaining:
          type: string
          example: '1000.00'
        listingId:
          type: string
          example: '5123456'
  parameters:
    startDate:
      name: startDate
      in: query
      description: Start date greater than or equal to a given date (iso date)
      schema:
        type: string
        example: '2023-09-16'
    pageSize:
      name: pageSize
      in: query
      description: Specify the number of results to return in one request, specified as an integer from `1` to `100`
      schema:
        type: integer
        example: 1
    pageIndex:
      name: pageIndex
      in: query
      description: Specify the page index of results to return. Zero index based.
      schema:
        type: integer
        example: 1
    status:
      name: status
      in: query
      description: Find all campaigns of a certain status. Available statuses are `Active`, `Pending`, `Completed` and `Unknown`.
      schema:
        type: string
        example: Active
    listingId:
      in: query
      name: listingId
      description: Return campaign list given a specific listing ID
      example: '5123456'
      schema:
        type: string
    campaignId:
      in: path
      name: campaignId
      schema:
        type: string
      required: true
      description: Return data given a specific campaign ID
    endDate:
      name: endDate
      in: query
      description: End date less than or equal to a given date (iso date)
      schema:
        type: string
        example: '2023-09-16'
  securitySchemes:
    PartnerPlatform:
      type: oauth2
      description: OAuth 2 Client Credentials grant flow
      flows:
        clientCredentials:
          tokenUrl: https://api.realestate.com.au/oauth/token
          scopes:
            display:campaign-performance:read: Read campaign performance records
