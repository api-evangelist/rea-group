                          - 'null'
                          description: 'Agent advised sale date

                            </br>Format `YYYY-MM-DD`'
                          format: date
                          examples:
                          - '2023-12-19'
                        saleValue:
                          type: integer
                          description: 'Agent advised sale value</br>

