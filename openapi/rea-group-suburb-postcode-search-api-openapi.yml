      - name: priceMax
        in: query
        description: 'Maximum price of the listing</br>Note: Price definition is set based on the `status` of the listing</br>-  If `status` equals `current`, `leased`, `notSold` or `notLeased` then the price is defined by the `listingPrice`</br>-  If `status` equals `sold` then the price is defined by the `saleValue`'
        schema:
          type: integer
          examples:
          - 1500000
      - name: priceMin
        in: query
        description: 'Minimum price of the listing</br>Note: Price definition is set based on the `status` of the listing</br>-  If `status` equals `current`, `leased` `notSold` or `notLeased` then the price is defined by the `listingPrice`</br>-  If `status` equals `sold` then the price is defined by the `saleValue`'
        schema:
          type: integer
          examples:
          - 1200000
      - name: propertyTypes
        in: query
        description: 'The type of properties that will be queried against</br>Note: Values are comma separated'
        schema:
          type: string
          enum:
          - house
          - unit
          examples:
          - house,unit
      - name: status
        in: query
        description: 'Choose the status of the listings returned</br>Note: Values are comma separated</br>Refer to [Listing Statuses](https://developer.proptrack.com.au/docs/apis/guide#listing-status)'
        schema:
