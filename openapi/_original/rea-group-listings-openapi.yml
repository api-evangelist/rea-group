      operationId: get-api-v2-listings-search-suburb-and-postcode
      x-stoplight:
        id: xqvuozzk6pabj
      description: "Retrieves current and historic listings within a given suburb. <br>\r\nThe suburb\
        \ search area is identified by a combination of state, suburb name, and up to 3 postcodes."
      servers:
      - url: https://data.proptrack.com
      parameters:
      - name: Authorization
        in: header
        description: Provide your bearer token as a string, in the format `Bearer {access_token}` in the
          Authorization Header</br>Refer to [Authentication](https://developer.proptrack.com.au/docs/apis/authentication/operations/create-a-oauth-2-token)
        required: true
        schema:
          type: string
          default: Bearer {access_token}
          examples:
          - Bearer jyJraWQiOiJiYWRmKzUyNC1jYzBkLTQ9YWUtYTAzMC02MjBlYTE3ZDNlZjMiLCJ0eXAiO
      - name: listingTypes
        in: query
        description: 'Select the type of listings returned</br>Note: Values are comma separated'
        required: true
        schema:
          type: string
          enum:
          - sale
          - rent
          examples:
          - sale,rent
      - name: bathroomsMax
        in: query
        description: Maximum number of bathrooms
        schema:
          type: integer
          examples:
          - 3
      - name: bathroomsMin
        in: query
        description: Minimum number of bathrooms
        schema:
          type: integer
          examples:
          - 1
      - name: bedroomsMax
        in: query
        description: Maximum number of bedrooms
        schema:
          type: integer
          examples:
          - 4
      - name: bedroomsMin
        in: query
        description: Minimum number of bedrooms
        schema:
          type: integer
          examples:
          - 2
      - name: carSpacesMax
        in: query
        description: Maximum number of car spaces
        schema:
          type: integer
          examples:
          - 2
      - name: carSpacesMin
        in: query
        description: Minimum number of car spaces
        schema:
          type: integer
          examples:
          - 1
      - name: landAreaMax
        in: query
        description: Maximum size of land space area (measured in m2)
        schema:
          type: integer
          examples:
          - 650
      - name: landAreaMin
        in: query
        description: Minimum size of land space area (measured in m2)
        schema:
          type: integer
          examples:
          - 500
      - name: priceMax
        in: query
        description: 'Maximum price of the listing</br>Note: Price definition is set based on the `status`
          of the listing</br>-  If `status` equals `current`, `leased`, `notSold` or `notLeased` then
          the price is defined by the `listingPrice`</br>-  If `status` equals `sold` then the price is
          defined by the `saleValue`'
        schema:
          type: integer
          examples:
          - 1500000
      - name: priceMin
        in: query
        description: 'Minimum price of the listing</br>Note: Price definition is set based on the `status`
          of the listing</br>-  If `status` equals `current`, `leased` `notSold` or `notLeased` then the
          price is defined by the `listingPrice`</br>-  If `status` equals `sold` then the price is defined
          by the `saleValue`'
        schema:
          type: integer
          examples:
          - 1200000
      - name: propertyTypes
        in: query
        description: 'The type of properties that will be queried against</br>Note: Values are comma separated'
        schema:
          type: string
          enum:
          - house
          - unit
          examples:
          - house,unit
      - name: status
        in: query
        description: 'Choose the status of the listings returned</br>Note: Values are comma separated</br>Refer
          to [Listing Statuses](https://developer.proptrack.com.au/docs/apis/guide#listing-status)'
        schema:
          type: string
          enum:
          - current
          - notSold
          - sold
          - notLeased
          - leased
          examples:
          - current,sold
      - name: startDate
        in: query
        description: Start of date range to be queried. Defaulted to 6 months prior to today's date if
          left empty</br>Format `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2022-11-04'
      - name: endDate
        in: query
        description: End of date range to be queried. Will default to today's date if left empty</br>Format
          `YYYY-MM-DD`
        schema:
          type: string
          format: date
          examples:
          - '2023-05-04'
      - name: pageSize
        in: query
        description: The maximum number of listings results that will be returned for each page</br>Refer
          to [Pagination](https://developer.proptrack.com.au/docs/apis/pagination)
        schema:
          type: integer
          maximum: 200
          default: 25
          examples:
          - 100
      - name: sortBy
        in: query
        description: 'Defines the sorting attribute and order in which the results will be returned</br>Note:
          sortBy date logic is set based on the status of the listing</br> - If `status` equals `sold`
          then the result is sorted by the `saleDate`  </br> - If `status` equals `leased` then the result
          is sorted by the `leaseDate`</br> - If `status` equals `current`, `notSold` or `notLeased` then
          the result is sorted by the `firstSeenDate`  '
        schema:
          type: string
          enum:
          - dateAsc
          - dateDesc
          - priceAsc
          - priceDesc
          default: dateDesc
          examples:
          - distanceAsc
          example: dateDesc
      - name: afterPageCursor
        in: query
        description: 'The page starting position as one listing after the defined cursor</br>Note: Cannot
          be used in conjunction with `beforePageCursor`</br>Refer to [Pagination](https://developer.proptrack.com.au/docs/apis/pagination)'
        schema:
          type: string
          examples:
          - MAo=
      - name: beforePageCursor
        in: query
        description: 'The page starting position as one listing prior to the defined cursor</br>Note:
          Cannot be used in conjunction with `afterPageCursor`</br>Refer to [Pagination](https://developer.proptrack.com.au/docs/apis/pagination)'
        schema:
          type: string
          examples:
          - MzAwMAo=
      - schema:
          type: string
          minItems: 1
          example: '3121'
          pattern: ^\d{4}$
        in: query
        name: postcodes
        description: List of up to 3 postcodes for the listing search area, as a comma-separated list.
          <br>The postcodes must be associated with the supplied suburb.
        required: true
      - schema:
          type: string
          example: Richmond
        in: query
        name: suburb
        description: The name of the suburb to search
        required: true
      - in: query
        name: state
        schema:
          type: string
          enum:
          - act
          - nsw
          - nt
          - qld
          - sa
          - tas
          - vic
          - wa
          example: vic
        required: true
        description: The name of the state that the suburb is in
      tags:
      - Suburb & Postcode Search
