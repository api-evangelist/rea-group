  /api/v1/reports/property:
    post:
      summary: /api/v1/reports/property
      description: Generates a property report for a given property.
      operationId: reports-property-report
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyId:
                  type: integer
                  description: Unique identifier for a property
                configId:
                  type: string
                  description: Unique report configuration identifier, provided by PropTrack</br>Default
                    is a standard PropTrack property report
                  format: uuid
                expiresAt:
                  type: string
                  description: 'Date after which the report will expire</br>Default is 90 days from date
                    of issue</br>Note: Maximum timeframe is 12 months</br>Format `YYYY-MM-DD`'
                meta:
                  type: object
