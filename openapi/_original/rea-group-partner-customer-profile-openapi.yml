                  - $ref: "#/components/schemas/HttpApiDecodeError"
                  - $ref: "#/components/schemas/RFC7807ApiError.DecodeError"
                  - $ref: "#/components/schemas/RFC7807ApiError.BadRequestError"
        "409":
          description: >-
            The request conflicts with the current state of the resource (RFC
            7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC7807ApiError.ConflictError"
        "500":
          description: An unexpected error occurred on the server (RFC 7807)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFC7807ApiError.InternalServerError"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - displayProfile
                - aboutMe
                - workingRelationships
                - lastName
              properties:
                firstName:
                  $ref: "#/components/schemas/NonEmptyString"
                displayProfile:
                  type: boolean
                aboutMe:
                  $ref: "#/components/schemas/NonEmptyString"
                workingRelationships:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - agencyId
                      - workplaceEmail
                      - contactEmail
                      - contactPhone
                      - roleType
                      - jobTitle
                    properties:
                      agencyId:
                        type: string
                        description: a string matching the pattern ^[A-Z]{6}$
                        pattern: ^[A-Z]{6}$
                      workplaceEmail:
                        type: string
                        description: >-
                          a string matching the pattern
                          ^(?!\.)(?!.*\.\.)([a-z0-9_'+\-.]*)[a-z0-9_+-]@([a-z0-9][a-z0-9-]*\.)+[a-z]{2,}$
                        pattern: >-
                          ^(?!\.)(?!.*\.\.)([a-z0-9_'+\-.]*)[a-z0-9_+-]@([a-z0-9][a-z0-9-]*\.)+[a-z]{2,}$
                      contactEmail:
                        type: string
                        description: >-
                          a string matching the pattern
                          ^(?!\.)(?!.*\.\.)([a-z0-9_'+\-.]*)[a-z0-9_+-]@([a-z0-9][a-z0-9-]*\.)+[a-z]{2,}$
                        pattern: >-
                          ^(?!\.)(?!.*\.\.)([a-z0-9_'+\-.]*)[a-z0-9_+-]@([a-z0-9][a-z0-9-]*\.)+[a-z]{2,}$
                      contactPhone:
                        type: string
                        description: a string matching the pattern ^\+614\d{8}$
                        pattern: ^\+614\d{8}$
                      roleType:
                        type: string
                        enum:
                          - Principal
                          - Sales
                          - PropertyManagement
                          - Administration
                      jobTitle:
                        $ref: "#/components/schemas/NonEmptyString"
                      primaryOffice:
                        type: boolean
                        description: >-
                          Indicates if this is the primary office. If set to
                          true, any existing primary working relationship will
                          be auto-demoted.
                    additionalProperties: false
                awards:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - year
                      - agencyId
                    properties:
                      name:
                        $ref: "#/components/schemas/NonEmptyString"
                      year:
                        $ref: "#/components/schemas/Int"
                        description: a number less than or equal to 2026
                        title: lessThanOrEqualTo(2026)
                        minimum: 1900
                        maximum: 2026
                      agencyId:
                        type: string
                        description: a string matching the pattern ^[A-Z]{6}$
                        pattern: ^[A-Z]{6}$
                    additionalProperties: false
                industryStartYear:
                  $ref: "#/components/schemas/Int"
                  description: a number less than or equal to 2026
                  title: lessThanOrEqualTo(2026)
                  minimum: 1900
                  maximum: 2026
                professionalWebsite:
                  anyOf:
                    - type: string
                    - anyOf:
                        - type: string
                          description: a string starting with "http://"
                          title: startsWith("http://")
                          pattern: ^http://
                        - type: string
                          description: a string starting with "https://"
                          title: startsWith("https://")
                          pattern: ^https://
                  description: a string at most 1024 character(s) long
                  title: maxLength(1024)
                  minLength: 10
                  maxLength: 1024
                profilePhoto:
                  anyOf:
                    - type: string
                    - anyOf:
                        - type: string
                          description: a string starting with "http://"
                          title: startsWith("http://")
                          pattern: ^http://
                        - type: string
                          description: a string starting with "https://"
                          title: startsWith("https://")
                          pattern: ^https://
                  description: >-
                    A URL pointing to an image file. The URL path must end with
                    .jpg, .jpeg, or .png.
                  title: maxLength(1024)
                  minLength: 10
                  maxLength: 1024
                secondaryProfilePhoto:
                  anyOf:
                    - type: string
                    - anyOf:
                        - type: string
                          description: a string starting with "http://"
                          title: startsWith("http://")
                          pattern: ^http://
                        - type: string
                          description: a string starting with "https://"
                          title: startsWith("https://")
                          pattern: ^https://
                  description: >-
                    A URL pointing to an image file. The URL path must end with
                    .jpg, .jpeg, or .png.
                  title: maxLength(1024)
                  minLength: 10
                  maxLength: 1024
                coverPhoto:
                  anyOf:
                    - type: string
                    - anyOf:
                        - type: string
                          description: a string starting with "http://"
                          title: startsWith("http://")
                          pattern: ^http://
                        - type: string
                          description: a string starting with "https://"
                          title: startsWith("https://")
                          pattern: ^https://
                  description: >-
                    A URL pointing to an image file. The URL path must end with
                    .jpg, .jpeg, or .png.
                  title: maxLength(1024)
                  minLength: 10
                  maxLength: 1024
                socials:
                  type: array
                  items:
                    $ref: "#/components/schemas/NonEmptyString"
                    description: a string at most 128 character(s) long
                    title: maxLength(128)
                    maxLength: 128
                videoLink:
                  type: string
                  description: >-
                    a string matching the pattern
                    ^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?![a-zA-Z0-9_-])(?:\S*)?$
                  title: maxLength(200)
                  maxLength: 200
                  pattern: >-
                    ^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?![a-zA-Z0-9_-])(?:\S*)?$
                specialities:
                  type: array
                  minItems: 1
                  items:
                    type: string
                communityInvolvement:
                  type: array
                  minItems: 1
                  items:
                    type: string
                lastName:
                  $ref: "#/components/schemas/NonEmptyString"
              additionalProperties: false
        required: true
