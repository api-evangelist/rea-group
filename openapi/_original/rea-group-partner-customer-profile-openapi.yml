components:
  schemas:
    HttpApiDecodeError:
      type: object
      required:
        - issues
        - message
        - _tag
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        message:
          type: string
        _tag:
          type: string
          enum:
            - HttpApiDecodeError
      additionalProperties: false
      description: The request did not match the expected schema
    Issue:
      type: object
      required:
        - _tag
        - path
        - message
      properties:
        _tag:
          type: string
          enum:
            - Pointer
            - Unexpected
            - Missing
            - Composite
            - Refinement
            - Transformation
            - Type
            - Forbidden
          description: The tag identifying the type of parse issue
        path:
          type: array
          items:
            $ref: "#/components/schemas/PropertyKey"
          description: The path to the property where the issue occurred
        message:
          type: string
          description: A descriptive message explaining the issue
      additionalProperties: false
      description: >-
        Represents an error encountered while parsing a value to match the
        schema
    PropertyKey:
      anyOf:
        - type: string
        - type: number
        - type: object
          required:
            - _tag
            - key
          properties:
            _tag:
              type: string
              enum:
                - symbol
            key:
              type: string
          additionalProperties: false
          description: an object to be decoded into a globally shared symbol
    NonEmptyString:
      type: string
      description: a non empty string
      title: nonEmptyString
      minLength: 1
    Int:
      type: integer
      description: an integer
      title: int
    UUID:
      type: string
      description: a Universally Unique Identifier
      format: uuid
      pattern: >-
        ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    RFC7807ApiError.DecodeError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - errors
        - _tag
      properties:
        type:
          type: string
          enum:
            - urn:rea:partner-profile-api:problems:validation-error
        title:
          type: string
          enum:
            - Bad Request
        status:
          type: number
          enum:
            - 400
        detail:
          $ref: "#/components/schemas/NonEmptyString"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        _tag:
          type: string
          enum:
            - RFC7807ApiError.DecodeError
      additionalProperties: false
      description: The request did not match the expected schema (RFC 7807)
    RFC7807ApiError.BadRequestError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - _tag
      properties:
        type:
          type: string
          enum:
            - urn:rea:partner-profile-api:problems:bad-request
        title:
          type: string
          enum:
            - Bad Request
        status:
          type: number
          enum:
            - 400
        detail:
          $ref: "#/components/schemas/NonEmptyString"
        _tag:
          type: string
          enum:
            - RFC7807ApiError.BadRequestError
      additionalProperties: false
      description: The request was invalid or cannot be served (RFC 7807)
    RFC7807ApiError.InternalServerError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - _tag
      properties:
        type:
          type: string
          enum:
            - urn:rea:partner-profile-api:problems:internal-server-error
        title:
          type: string
          enum:
            - Internal Server Error
        status:
          type: number
          enum:
            - 500
        detail:
          $ref: "#/components/schemas/NonEmptyString"
        _tag:
          type: string
          enum:
            - RFC7807ApiError.InternalServerError
      additionalProperties: false
      description: An unexpected error occurred on the server (RFC 7807)
    RFC7807ApiError.ConflictError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - _tag
      properties:
        type:
          type: string
          enum:
            - urn:rea:partner-profile-api:problems:conflict
        title:
          type: string
          enum:
            - Conflict
        status:
          type: number
          enum:
            - 409
        detail:
          $ref: "#/components/schemas/NonEmptyString"
        _tag:
          type: string
          enum:
            - RFC7807ApiError.ConflictError
      additionalProperties: false
      description: The request conflicts with the current state of the resource (RFC 7807)
    RFC7807ApiError.NotFoundError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - _tag
      properties:
        type:
          type: string
          enum:
            - urn:rea:partner-profile-api:problems:not-found
        title:
          type: string
          enum:
            - Not Found
        status:
          type: number
          enum:
            - 404
        detail:
          $ref: "#/components/schemas/NonEmptyString"
        _tag:
          type: string
          enum:
            - RFC7807ApiError.NotFoundError
      additionalProperties: false
      description: The requested resource could not be found (RFC 7807)
    NumberFromString:
      type: string
      description: a string to be decoded into a number
    BooleanFromString:
      type: string
      enum:
        - "true"
        - "false"
      description: a string to be decoded into a boolean
security: []
