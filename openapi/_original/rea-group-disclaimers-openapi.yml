paths:
  /api/v1/disclaimers:
    get:
      summary: /api/v1/disclaimers
      tags:
      - Disclaimers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  x-stoplight:
                    id: tvekosjw8x3is
                  type: object
                  properties:
                    disclaimerType:
                      x-stoplight:
                        id: t2qu2rvqvhtyn
                      enum:
                      - vg
                      - serviceAgent
                      - geoscape
                      - archistar
                      - abs
                    state:
                      x-stoplight:
                        id: 4to6f3xlh3j7o
                      description: "Indicates which state this disclaimer is applicable to.<br>\r\nIf\
                        \ the disclaimer is national, this value will return as `null`"
                      example: VIC
                      enum:
                      - VIC
                      - NSW
                      - QLD
                      - SA
                      - NT
                      - WA
                      - TAS
                      - ACT
                      - null
                    disclaimerContent:
                      type: string
                      x-stoplight:
                        id: l1tdy4osbmic2
                      description: Provides a string containing the required disclaimer text, in the preferred
                        format, for the given disclaimerId
                      example: '<p>The Territory Data is the property of the Australian Capital Territory. 
                        No part of it may in any form or by any means (electronic, mechanical, micro copying,
                        photocopying, recording or otherwise) be reproduced, stored in a retrieval system
                        or transmitted without prior written permission.  Enquiries should be directed
                        to: <a href="mailto:acepdcustomerservices@act.gov.au">acepdcustomerservices@act.gov.au</a></p>
                        <p>Director, Customer Coordination, Access Canberra, ACT Government, GPO Box 158
                        CANBERRA ACT 2601.</p>'
                    effectiveStartDate:
                      type: string
                      x-stoplight:
                        id: zemic68aiqti1
                      description: Indicates the date at which the provided disclaimer text became current.
                      format: date
                      example: '2023-01-01'
                    effectiveEndDate:
                      type:
                      - string
                      - 'null'
                      x-stoplight:
                        id: ef57cyhara1y0
                      description: "Provides the date at which the provided version of the disclaimer\
                        \ ceased to be current. <br>\r\nWhere the provided disclaimer is current, the\
                        \ effectiveEndDate will be null"
                      example: null
                      format: date
                    brandingImage:
                      type:
                      - string
                      - 'null'
                      x-stoplight:
                        id: lnj7fty6rxdrq
                      description: 'The branding image associated with the data source.<br><i>Note that
                        only the `Archistar` disclaimerType includes a branding image URL, which is required
                        to be displayed along with the disclaimer text. <br>Additional branding may be
                        required for your usage of PropTrack APIs - please confirm with your account manager. '
              examples:
                VG - One state HTML:
                  value:
                  - disclaimerType: vg
                    disclaimerContent: '<p>The Territory Data is the property of the Australian Capital
                      Territory.  No part of it may in any form or by any means (electronic, mechanical,
                      micro copying, photocopying, recording or otherwise) be reproduced, stored in a
                      retrieval system or transmitted without prior written permission.  Enquiries should
                      be directed to: <a href="mailto:acepdcustomerservices@act.gov.au">acepdcustomerservices@act.gov.au</a></p>
                      <p>Director, Customer Coordination, Access Canberra, ACT Government, GPO Box 158
                      CANBERRA ACT 2601.</p>'
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: ACT
                    brandingImage: null
                VG - All states HTML:
                  value:
                  - disclaimerType: vg
                    disclaimerContent: <p>The State of Victoria owns the copyright in the property sales
                      data and reproduction of that data in any way without the consent of the State of
                      Victoria will constitute a breach of the Copyright Act 1968 (Cth).  The State of
                      Victoria does not warrant the accuracy or completeness of the licensed material
                      and any person using or relying upon such information does so on the basis that
                      the State of Victoria accepts no responsibility or liability whatsoever for any
                      errors, faults, defects or omissions in the information supplied</p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: VIC
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: <p>Contains property sales information provided under licence from
                      the Valuer General New South Wales. PropTrack Pty Ltd is authorised as a Property
                      Sales Information provider by the Valuer General New South Wales.<p>
                    effectiveStartDate: '2024-07-01'
                    effectiveEndDate: null
                    state: NSW
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: <p>Based on or contains data provided by the State of Queensland
                      (Department of Resources) 2024. In consideration of the State permitting use of
                      this data you acknowledge and agree that the State gives no warranty in relation
                      to the data (including accuracy, reliability, completeness, currency or suitability)
                      and accepts no liability (including without limitation, liability in negligence)
                      for any loss, damage or costs (including consequential damage) relating to any use
                      of the data. Data must not be used for direct marketing or be used in breach of
                      the privacy laws.</p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: QLD
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: <p>Copyright in this information belongs to the South Australian
                      Government and the South Australian Government does not accept any responsibility
                      for the accuracy or completeness of the information or its suitability for any purpose.</p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: SA
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: <p>Based on information provided under licence by the Department
                      of Lands and Planning, Northern Territory of Australia.</p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: NT
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: '<p>The Territory Data is the property of the Australian Capital
                      Territory.  No part of it may in any form or by any means (electronic, mechanical,
                      micro copying, photocopying, recording or otherwise) be reproduced, stored in a
                      retrieval system or transmitted without prior written permission.  Enquiries should
                      be directed to: <a href="mailto:acepdcustomerservices@act.gov.au">acepdcustomerservices@act.gov.au</a></p>
                      <p>Director, Customer Coordination, Access Canberra, ACT Government, GPO Box 158
                      CANBERRA ACT 2601.</p>'
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: WA
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: '<p>The Territory Data is the property of the Australian Capital
                      Territory.  No part of it may in any form or by any means (electronic, mechanical,
                      micro copying, photocopying, recording or otherwise) be reproduced, stored in a
                      retrieval system or transmitted without prior written permission.  Enquiries should
                      be directed to: <a href="mailto:acepdcustomerservices@act.gov.au">acepdcustomerservices@act.gov.au</a></p>
                      <p>Director, Customer Coordination, Access Canberra, ACT Government, GPO Box 158
                      CANBERRA ACT 2601.</p>'
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: TAS
                    brandingImage: null
                  - disclaimerType: vg
                    disclaimerContent: '<p>The Territory Data is the property of the Australian Capital
                      Territory.  No part of it may in any form or by any means (electronic, mechanical,
                      micro copying, photocopying, recording or otherwise) be reproduced, stored in a
                      retrieval system or transmitted without prior written permission.  Enquiries should
                      be directed to: <a href="mailto:acepdcustomerservices@act.gov.au">acepdcustomerservices@act.gov.au</a></p>
                      <p>Director, Customer Coordination, Access Canberra, ACT Government, GPO Box 158
                      CANBERRA ACT 2601.</p>'
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    state: ACT
                    brandingImage: null
                Service Agent and Vic VG:
                  value:
                  - disclaimerType: vg
                    state: VIC
                    disclaimerContent: <p>The State of Victoria owns the copyright in the property sales
                      data and reproduction of that data in any way without the consent of the State of
                      Victoria will constitute a breach of the Copyright Act 1968 (Cth).  The State of
                      Victoria does not warrant the accuracy or completeness of the licensed material
                      and any person using or relying upon such information does so on the basis that
                      the State of Victoria accepts no responsibility or liability whatsoever for any
                      errors, faults, defects or omissions in the information supplied</p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    brandingImage: null
                  - disclaimerType: serviceAgent
                    state: null
                    disclaimerContent: <p>This information is supplied by [your company & ABN] on behalf
                      of PropTrack Pty Ltd (ABN 43 127 386 298). <a href="https://www.proptrack.com.au/product-disclaimers/
                      ">Copyright and Legal Disclaimers about Property Data</a></p>
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    brandingImage: null
                VG - One state Plaintext:
                  value:
                  - disclaimerType: vg
                    state: VIC
                    disclaimerContent: The State of Victoria owns the copyright in the property sales
                      data and reproduction of that data in any way without the consent of the State of
                      Victoria will constitute a breach of the Copyright Act 1968 (Cth).  The State of
                      Victoria does not warrant the accuracy or completeness of the licensed material
                      and any person using or relying upon such information does so on the basis that
                      the State of Victoria accepts no responsibility or liability whatsoever for any
                      errors, faults, defects or omissions in the information supplied
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    brandingImage: null
                Archistar Disclaimer:
                  value:
                  - disclaimerType: archistar
                    disclaimerContent: powered by Archistar (https://www.archistar.ai)
                    state: null
                    effectiveStartDate: '2000-01-01'
                    effectiveEndDate: null
                    brandingImage: https://info.proptrack.com/hubfs/Disclaimers/Archistar%20Logo%20Primary.svg
        '400':
          description: '<!-- theme: danger -->


            > #### Bad Request (400)'
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
              description: Media type of the resource
            X-Transaction-Id:
              schema:
                type: string
                example: bxxe12cb-a6a8-4cad-9a8c-4f1d8abfa0d9
              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: ifqemifoqn4eh
                    items:
                      x-stoplight:
                        id: vdgq7167cah3q
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: wvc0mcv8zymcp
                          enum:
                          - 7004
                          - 7008
                          - 7011
                          description: Defines the type of error that has occurred
                        description:
                          type: string
                          x-stoplight:
                            id: 4cdehjwuetudy
                          description: Overview of the error that has occurred
                          example: An incorrect field type has been entered - Please ensure that all values
                            are using the correct field type
                        parameters:
                          type: object
                          x-stoplight:
                            id: 1pb57b2sf3iso
                          description: A set of parameters that are causing the error and the rule that
                            was invoked
                          properties:
                            propertyId:
                              type: string
                              x-stoplight:
                                id: fl6kgpnmj54rc
                              example: must be an integer
                      required:
                      - code
                      - description
        '401':
          description: '<!-- theme: danger -->


            > #### Unauthorized (401)'
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
              description: Media type of the resource
            X-Transaction-Id:
              schema:
                type: string
                example: bxxe12cb-a6a8-4cad-9a8c-4f1d8abfa0d9
              description: Should be quoted as a reference for any support request/unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    x-stoplight:
                      id: 2cn4e9rbqk9u7
                    items:
                      x-stoplight:
                        id: mx349sglwnu4d
                      type: object
                      properties:
                        code:
                          x-stoplight:
                            id: w1ccyp3pxolps
                          enum:
                          - 9012
                          - 9016
                          description: Defines the type of error that has occurred
                        level:
                          x-stoplight:
                            id: 7oap34cfukd8i
                          x-deprecated: true
                          enum:
                          - CRITICAL
                        description:
                          type: string
                          x-stoplight:
                            id: 1dhw0vx43b4dj
