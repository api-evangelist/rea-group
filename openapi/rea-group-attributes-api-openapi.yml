                            example: 2
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: bdu1bh1o3lxyb
                            description: Date that the source provided the data for this record.</br>Format `YYYY-MM-DD`
                            format: date
                            example: '2023-01-25'
                      floorArea:
                        type:
                        - object
                        - 'null'
                        x-stoplight:
                          id: oalb1kyuw9viz
