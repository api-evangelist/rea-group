                          value:
                            type: integer
                            x-stoplight:
                              id: 0p66jx4bak7za
                            description: Floor space area (measured in m2)
                            example: 325
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: peqx778ewgee3
                            description: Date that the source provided the data for this record.</br>Format `YYYY-MM-DD`
                            format: date
                            example: '2023-01-25'
                      landArea:
