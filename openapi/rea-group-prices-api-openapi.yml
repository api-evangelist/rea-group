                        displayPrice: $250.00
                        price: '250.00'
                        rackPrice: '350.00'
                        currency: AUD
                    manual:
                    - product: luxe
                      productName: Luxe Unlimited - Buy
                      displayPrice: $2000.00
                      price: '2000.00'
                      rackPrice: '2000.00'
                      currency: AUD
                      topUpPrice: '1000.00'
                    - product: property-showcase
                      productName: Property Showcase - Buy
                      displayPrice: $100.00
                      price: '100.00'
                      rackPrice: '100.00'
                      currency: AUD
                    flex:
                      exceptionDowngrade:
                      - product: highlight
                        productName: Highlight (30 days) - Buy
                        duration: 30
                        displayPrice: $400.00
