            application/hal+json:
              schema:
                $ref: '#/components/schemas/realestate_products'
              examples:
                UMP:
                  summary: Ultimate Marketing Package
                  value:
                    _links:
                      self:
                        href: https://api.realestate.com.au/prices/v1/realestate-properties?agency_id=FEXBNP&suburb=Sydney&state=NSW&postcode=2000
                    section: buy
                    listingType: residential
                    reupgrade: false
                    date: '1970-01-01'
                    all:
                    - product: premiere
