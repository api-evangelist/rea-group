                              id: 4j5d3mcdk6n3h
                            enum:
                            - 'true'
                            - 'false'
                            - maybe
                            example: 'true'
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: d5d2d6v2imbq9
                            format: date
                      permittedUseTownhouse:
                        type: object
                        x-stoplight:
                          id: ypvc59r4mbp5r
                        properties:
                          value:
                            x-stoplight:
                              id: n5pwncbt5hs6k
                            enum:
                            - 'true'
                            - 'false'
                            - maybe
                            example: 'true'
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: ejg8x9t9gnlce
                            format: date
              examples:
                Example 1:
                  value:
                    propertyId: 8282053
                    zoning:
                    - isPrimary: true
                      zoneCode: R2
                      zoneLabel1: Low density residential
                      zoneLabel2: R2 Low Density Residential
                      lgaName: string
                      lgaPlanningUrl: https://www.cityofparramatta.nsw.gov.au/development/planning/development-control-plans
                      permittedUse:
                      - Home occupations
                      permittedUseWithControls:
                      - Attached dwellings
                      prohibitedUse:
                      - Animal boarding or training establishments
                      sourceDate: '2024-03-26'
                    propertyUse:
                      permittedUseApartment:
                        value: 'true'
                        sourceDate: '2019-08-24'
                      permittedUseDuplex:
                        value: 'true'
                        sourceDate: '2019-08-24'
                      permittedUseMixedUse:
                        value: 'true'
                        sourceDate: '2019-08-24'
                      permittedUseTownhouse:
                        value: maybe
                        sourceDate: '2019-08-24'
