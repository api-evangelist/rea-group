openapi: 3.2.0
info:
  version: '1.0'
  title: Properties Planning API
  description: 'Properties API


    - **Properties/Summary: **GET** /api/v2/properties/{propertyId}/summary**

    Retrieves basic property and listing information about a property, including a single photo and current market status


    - **Properties/Attributes: **GET** /api/v2/properties/{propertyId}/attributes**

    Retrieves comprehensive and up to date property attributes and features for a given property


    - **Properties/Listings: **GET** /api/v2/properties/{propertyId}/listings**

    Retrieves current and historic listings…'
  contact:
    email: support@proptrack.com
    name: PropTrack Support
servers:
- url: https://data.proptrack.com
  description: ''
tags:
- name: Planning
  description: Property Planning Overlays
paths:
  /api/v2/properties/{propertyId}/planning:
    parameters:
    - schema:
        type: string
      name: propertyId
      in: path
      required: true
    get:
      summary: /properties/{propertyId}/planning
      parameters:
      - schema:
          type: integer
          example: 8282053
        in: query
        name: propertyId
        description: Unique identifier for a property<br>Refer to [Obtaining a propertyId](https://developer.proptrack.com.au/docs/apis/guide#obtaining-a-propertyid)
        required: true
      - schema:
          type: string
          example: Bearer xxxxx
        in: header
        name: Authorization
        description: Provide your bearer token as a string, in the format Bearer {access_token} in the Authorization Header Refer to Authentication
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
