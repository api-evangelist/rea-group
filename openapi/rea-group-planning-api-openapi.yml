                          value:
                            x-stoplight:
                              id: l5eq1manpa7ek
                            example: 'true'
                            enum:
                            - 'true'
                            - 'false'
                            - maybe
                          sourceDate:
                            type: string
                            x-stoplight:
                              id: usf3evnauyfqu
                            format: date
                      permittedUseDuplex:
