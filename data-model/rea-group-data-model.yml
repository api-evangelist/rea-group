  type: has_many
  via: state+postcode+suburb
  evidence: market endpoints are keyed by searchType plus state/postcode/suburb rather than by propertyId
notes:
- 'The address-match -> propertyId -> {listings, transactions, attributes, valuations} chain is the
  spine of the API: almost every workflow starts by resolving a free-text address to a propertyId.'
- The Market surface is the one branch NOT keyed by propertyId - it is keyed by geography (state,
  postcode, suburb) and returns aggregate metrics, so it does not join to the property graph directly.
- Because the specs inline every schema, the same logical entity (for example address) is redefined
  in each operation and the definitions are not guaranteed identical. Reuse via components.schemas
  would make the model authoritative rather than reconstructed.
