enforcement:
  model: rolling-window
  window_seconds: 1
  scope: per-endpoint
  detail: A sliding one-second window per endpoint. On each request, expired requests from the previous interval
    are evicted and the count updated; the window resets continuously rather than on a fixed boundary.
  headers_exposed: false
  headers_note: No RateLimit or X-RateLimit response headers are documented. A client cannot observe remaining budget
    - the only signal is the 429 after the limit is hit.
violation:
  http_status: 429
  error_code: 9011
  body: '{"errors":[{"code":9011,"description":"Rate limit has been exceeded - Please try again shortly"}]}'
quota:
  model: per-endpoint request allocation
  applies_to: trial and paid agreements
  http_status: 429
  error_code: 9011
  body: '{"errors":[{"code":9011,"description":"Quota limit has been reached - Please contact our customer support
    team at support@proptrack.com for further information"}]}'
  detail: 'Distinct from the per-second rate limit: a total request allocation per endpoint set commercially. Both
    successful and failed requests count toward it. Rate-limit and quota exhaustion share HTTP 429 and error code
    9011 and are distinguishable only by the description text.'
  docs: https://developer.proptrack.com.au/docs/apis/api-trials
