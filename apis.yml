x-enrichment:
  date: '2026-07-27'
  status: enriched
  pass: local-v2
  method: >-
    Contract discovery against the PropTrack Stoplight workspace recovered nine
    provider-published OpenAPI 3.1.0 documents (32 operations, 189 named examples)
    plus thirteen documentation articles, which grounded a full artifact rebuild.
  artifacts_added:
  - openapi/ (9 documents, searched)
  - errors/rea-group-error-codes.yml (18 codes, searched)
  - rate-limits/rea-group-rate-limits.yml (16 endpoint limits, searched)
  - plans/rea-group-plans.yml (searched)
  - sandbox/rea-group-sandbox.yml (9 live mock servers, searched + verified)
  - examples/rea-group-examples.yml (derived)
  - data-model/rea-group-data-model.yml (derived)
  - mcp/rea-group-mcp.yml (derived candidate, not published by provider)
  - skills/ (3 skills + index, generated)
  - agentic-access/rea-group-agentic-access.yml (generated)
  - overlays/rea-group-security-overlay.yaml (generated)
  artifacts_upgraded:
  - authentication/ (unknown token URL -> full OAuth client-credentials profile)
  - conventions/ (4 unknowns -> cursor pagination, error envelope, tracing header)
  - lifecycle/ (added concurrent v1/v2, roadmap, verified no status page)
  - conformance/ (4 standards -> 13, incl. RESO non-conformance rationale)
  not_emitted:
  - >-
    MCPServer pointer - PropTrack publishes no MCP server. The mcp/ artifact is a
    derived candidate surface only; claiming the pointer would assert a server
    that does not exist.
  - >-
    Idempotency pointer - no idempotency key, header or safe-retry contract is
    documented, and the three billable POST operations have none.
  - >-
    Compliance pointer - no trust centre, SOC 2 or ISO 27001 attestation is
    published.
  - >-
    StatusPage / Deprecation pointers - verified absent, not merely unfound.
  - >-
    Packages / SDKs pointers - no first-party client libraries on npm or PyPI.
  - >-
    OAuthScopes - OAuth 2.0 is client-credentials with no published scope surface.
