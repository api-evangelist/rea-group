    type: DeveloperPortal
  description: >-
    The realestate.com.au Partner Portal is REA Group's integration surface for agencies and their software
    / CRM providers - covering partner onboarding, API credential management (Client ID + API secret key
    issued in the REA Portal), listing distribution configuration, and delivery of buyer and renter enquiries
    and leads back to partner systems. Authenticated via REA Group's OAuth identity service; access is
    partner-gated and requires an approved commercial agreement.
