aid: rea-group

url: https://raw.githubusercontent.com/api-evangelist/rea-group/refs/heads/main/apis.yml

name: REA Group

kind: company

description: REA Group Limited is an ASX-listed (ASX:REA) digital real estate advertising business headquartered in Melbourne, Australia and majority-owned
  by News Corp. It operates realestate.com.au and realcommercial.com.au, the property data and analytics brand PropTrack, the Mortgage Choice
  broking network, and REA India (Housing.com, PropTiger, and Makaan). REA Group's public developer surface is delivered through PropTrack, whose
  developer portal publishes nine OpenAPI 3.1 documents covering 32 operations - OAuth token issuance, address matching and suggestion, property
  summary, attributes, planning, tenure, listings and transactions, automated valuations (AVM Sale, Rent, Plus and Pro), PDF valuation and property
  reports, suburb-level market history, supply and demand, auction results and demographics, plus a Disclaimers API that serves the attribution
  text PropTrack contractually requires alongside its data. Every service also publishes a live, unauthenticated Stoplight mock server, so the
  contract can be exercised before a commercial agreement is signed. The APIs are documented publicly but are partner-gated - access requires
  a commercial agreement arranged through an Account Manager, and calls are authenticated with OAuth 2.0 client credentials exchanged for a one-hour
  JWT bearer token at data.proptrack.com. Alongside PropTrack, REA Group runs the realestate.com.au Partner Portal (partner.realestate.com.au),
  the integration surface for real estate agencies and their CRM / software providers to publish for-sale and for-rent listings onto realestate.com.au
  and realcommercial.com.au and to receive buyer and renter enquiries. Listing distribution uses REAXML, REA's long-standing industry-standard
  XML property feed (schema published at reaxml.realestate.com.au), which the majority of Australian agency CRMs implement, with partner onboarding,
  API credentials (Client ID + secret) and enquiry delivery managed through the partner portal.

