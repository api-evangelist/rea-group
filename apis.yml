- aid: rea-group:realestate-listing-feed-reaxml
  name: realestate.com.au Listing Feed (REAXML)
  tags:
  - Listings
  - Feed
  - REAXML
  - Real-Estate
  - Australia
  tags_raw:
  - Listings
  - Feed
  - REAXML
  - Real Estate
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://partner.realestate.com.au/
  baseURL: https://reaxml.realestate.com.au
  properties:
  - url: https://partner.realestate.com.au/
    type: DeveloperPortal
  - url: https://reaxml.realestate.com.au/propertyList.dtd
    type: Schema
  description: >-
    REA Group's REAXML listing feed - the long-standing industry-standard XML property schema used by
    Australian agency CRMs to publish residential and commercial for-sale and for-rent listings onto realestate.com.au
    and realcommercial.com.au. Registered data/interconnect providers upload listing payloads (create/update/withdraw/sold)
    validated against the published propertyList DTD. Access is gated through the realestate.com.au Partner
    Portal and requires an approved uploader agreement with API credentials (Client ID + secret).
